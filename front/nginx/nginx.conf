server
{
	listen 80 default_server;
	listen [::]:80 default_server;
	root /usr/share/nginx/pintour/browser;
	index index.html index.htm index.nginx-debian.html
	server_name _;
	location /
	{

		set $prerender 0;
		     # lista crawler più comuni
        if ($http_user_agent ~* "Googlebot|Bingbot|Slurp|DuckDuckBot|Baiduspider|YandexBot|Sogou|facebot|facebookexternalhit|twitterbot|LinkedInBot|WhatsApp") {
            set $prerender 1;
        }

        # parametro usato dai crawler
        if ($args ~ "_escaped_fragment_") {
            set $prerender 1;
        }

        # se è crawler → manda a prerender
        if ($prerender = 1) {
            proxy_pass http://prerender:3000;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $host;
            break;
        }

		root /usr/share/nginx/pintour/browser;
		index index.html;
		try_files $uri $uri/ /index.html;
		index index.html index.htm;
		 
	}
	 location /api/
	{

           set_real_ip_from 0.0.0.0/0;
		   real_ip_header X-Forwarded-For;
		   real_ip_recursive on;

		#    include /etc/nginx/proxy_params;
        proxy_read_timeout 1d;
        proxy_connect_timeout 1d;
        proxy_send_timeout 1d; 
		proxy_pass http://back:1801/;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection keep-alive;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $remote_addr;
		#    proxy_headers_hash_max_size: 90048;
		proxy_cache_bypass $http_upgrade;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_headers_hash_max_size 512;
		proxy_headers_hash_bucket_size 128;
	}

 

}
