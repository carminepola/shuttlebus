server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/pintour/browser;
    index index.html;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; font-src 'self' data: https://cdnjs.cloudflare.com; script-src 'self' 'unsafe-hashes' 'sha256-MhtPZXr7+LpJUY5qtMutB+qWfQtMaPccfe7QXtCcEYc='; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
      
 
    # API backend
    # location /api/ {
    #     proxy_read_timeout 1d;
    #     proxy_connect_timeout 1d;
    #     proxy_send_timeout 1d;
    #     proxy_pass http://back:1801/;
    #     proxy_http_version 1.1;

    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection "keep-alive";
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    location / {
      
        try_files $uri /index.html;
    }

   

 
}
