server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/pintour/browser;
    index index.html;

    # --- log standard ---
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # --- log personalizzato per prerender ---
    log_format prerender_log '$remote_addr - $remote_user [$time_local] '
                             '"$request" $status $body_bytes_sent '
                             '"$http_referer" "$http_user_agent" '
                             'IS_BOT=$is_bot FULLURL=$full_url';

    access_log /var/log/nginx/prerender.log prerender_log;

    # --- SPA principale ---
    location / {
        try_files $uri $uri/ @prerender /index.html?$args;
    }

    # --- API backend ---
    location /api/ {
        set_real_ip_from 0.0.0.0/0;
        real_ip_header X-Forwarded-For;
        real_ip_recursive on;

        proxy_read_timeout 1d;
        proxy_connect_timeout 1d;
        proxy_send_timeout 1d;
        proxy_pass http://back:1801/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "keep-alive";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- fallback prerender ---
    location @prerender {
        # Flag per bot
        set $is_bot 0;
        set $full_url "-";

        if ($http_user_agent ~* "googlebot|bingbot|yandex|facebookexternalhit|twitterbot|linkedinbot|whatsapp|telegrambot") {
            set $is_bot 1;
        }
        if ($args ~ "_escaped_fragment_") {
            set $is_bot 1;
        }

        # Escludi assets
        if ($uri ~* "\.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|pdf)$") {
            set $is_bot 0;
        }

        # Solo se è bot → prerender locale
        if ($is_bot = 1) {
            set $full_url $scheme://$host$request_uri;

            # log su error log per debug immediato
            add_header X-Debug-Prerender "1";

            proxy_pass http://prerender:3000/render?url=$full_url;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            break;
        }

        # fallback SPA normale
        rewrite .* /index.html break;
    }
}
