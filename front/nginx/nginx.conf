server
{
	listen 80 default_server;
	listen [::]:80 default_server;
	root /usr/share/nginx/pintour/browser;
	index index.html index.htm index.nginx-debian.html
	server_name _;
	location /
	{

		root /usr/share/nginx/pintour/browser; 
		index index.html index.htm; 
		try_files $uri $uri/ @prerender /index.html?$args;

		 
	}
	 location /api/
	{

           set_real_ip_from 0.0.0.0/0;
		   real_ip_header X-Forwarded-For;
		   real_ip_recursive on;

		#    include /etc/nginx/proxy_params;
        proxy_read_timeout 1d;
        proxy_connect_timeout 1d;
        proxy_send_timeout 1d; 
		proxy_pass http://back:1801/;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection keep-alive;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $remote_addr;
		#    proxy_headers_hash_max_size: 90048;
		proxy_cache_bypass $http_upgrade;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_headers_hash_max_size 512;
		proxy_headers_hash_bucket_size 128;
	}
    location @prerender
	{
 

		set $prerender 0;
		if ($http_user_agent ~* "Mediapartners-Google|MetaInspector/5.5.0|OpenGraphCheck|MetadataScraper|MetaInspector|Whatsapp|baiduspider|facebookexternalhit|twitterbot|pinterest|vkshare|googlebot|YandexBot|AppleBot|bingbot|Bingpreview|facebookplatform|msnbot|slurp|Bucean|WebCrawler|TennSpider|PolyBot|WebFountain|WebRACE|baiduspider|facebookexternalhit|twitterbot|rogerbot|linkedinbot|embedly|quora\ link\ preview|showyoubot|outbrain|pinterest|Slackbot|Slack-ImgProxy|Slackbot-LinkExpanding|Site\ Analyzer|SiteAnalyzerBot|Viber|Whatsapp|Telegram [NC,OR]")
		{
			set $prerender 1;
		}
		if ($args ~ "_escaped_fragment_")
		{
			set $prerender 1;
		}
		if ($http_user_agent ~ "Prerender")
		{
			set $prerender 0;
		}
		if ($uri ~ "\.(js|css|xml|less|png|svg|jpg|jpeg|gif|pdf|doc|txt|ico|rss|zip|mp3|rar|exe|wmv|doc|avi|ppt|mpg|mpeg|tif|wav|mov|psd|ai|xls|mp4|m4a|swf|dat|dmg|iso|flv|m4v|torrent|ttf|woff)")
		{
			set $prerender 0;
		}

		#resolve using Google's DNS server to force DNS resolution and prevent caching of IPs
		resolver 8.8.8.8;

		if ($prerender = 1)
		{
            set $full_url $scheme://$host$request_uri;
			#setting prerender as a variable forces DNS resolution since nginx caches IPs and doesnt play well with load balancing
			set $prerender "service.prerender.io"; 
			proxy_pass http://prerender:3000/render?url=$full_url;
		}
		if ($prerender = 0)
		{
			rewrite .* /index.html break;
		}
	}

 

}
