# --- MAPS per decidere se usare prerender ---
map $http_user_agent $is_bot {
    default 0;
    "~*Googlebot|Bingbot|Slurp|DuckDuckBot|Baiduspider|YandexBot|Sogou|facebot|facebookexternalhit|twitterbot|LinkedInBot|WhatsApp" 1;
}

map $args $escaped_fragment {
    default 0;
    "~_escaped_fragment_" 1;
}

# unisco i due flag in uno solo
map "$is_bot$escaped_fragment" $use_prerender {
    default 0;
    "10" 1;
    "01" 1;
    "11" 1;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    root /usr/share/nginx/pintour/browser;
    index index.html index.htm index.nginx-debian.html;
    server_name _;

    # --- richieste che devono andare a prerender ---
    location / {
        root /usr/share/nginx/pintour/browser;

        # se è un bot/crawler → prerender
        proxy_pass http://prerender:3000;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;

        # match solo se $use_prerender = 1
        if ($use_prerender = 0) {
            # esci dal proxy e servi angular
            break;
        }
    }

    # --- utenti normali ---
    location @angular {
        root /usr/share/nginx/pintour/browser;
        try_files $uri $uri/ /index.html;
    }

    # fallback: se non deve andare a prerender → passa qui
    error_page 418 = @angular;
    if ($use_prerender = 0) {
        return 418;
    }

    # --- API ---
    location /api/ {
        set_real_ip_from 0.0.0.0/0;
        real_ip_header X-Forwarded-For;
        real_ip_recursive on;

        proxy_read_timeout 1d;
        proxy_connect_timeout 1d;
        proxy_send_timeout 1d; 
        proxy_pass http://back:1801/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "keep-alive";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_headers_hash_max_size 512;
        proxy_headers_hash_bucket_size 128;
    }
}
