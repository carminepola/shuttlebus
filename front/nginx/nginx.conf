server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/pintour/browser;
    index index.html;

    ##############################
    # SPA principale con prerender
    ##############################
    location / {
        set $prerender 0;

        # Bot comuni o _escaped_fragment_
        if ($http_user_agent ~* "Mediapartners-Google|MetaInspector|Whatsapp|facebookexternalhit|twitterbot|bingbot|googlebot") {
            set $prerender 1;
        }

        if ($args ~ "_escaped_fragment_") {
            set $prerender 1;
        }

        # Esclude il prerender stesso
        if ($http_user_agent ~ "Prerender") {
            set $prerender 0;
        }

        # Esclude file statici
        if ($uri ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|ttf|pdf|txt)$) {
            set $prerender 0;
        }

        # Se prerender = 1, passa a location named @prerender
        if ($prerender = 1) {
            return 418;
        }

        # Altrimenti serve SPA
        try_files $uri /index.html;
    }

    # Gestione location named per prerender
    location @prerender {
        internal;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header User-Agent "";

        # Riscrive il path per Prerender
        rewrite ^(.*)$ /render?url=$scheme://$host$request_uri break;

        proxy_pass http://prerender:3000;

        # Timeout generosi per Prerender
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        send_timeout 60s;
    }

    # API backend
    location /api/ {
        proxy_read_timeout 1d;
        proxy_connect_timeout 1d;
        proxy_send_timeout 1d;
        proxy_pass http://back:1801/;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "keep-alive";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Error page per forzare il passaggio a @prerender
    error_page 418 = @prerender;
}
