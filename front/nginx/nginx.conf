server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/pintour/browser;
    index index.html;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; font-src 'self' data: https://cdnjs.cloudflare.com; script-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
      
 
    location / {
      
        try_files $uri /index.html;
    }

    # PWA: index, manifest e file del service worker sempre rivalidati, altrimenti
    # il browser continua a servire la versione vecchia dopo un deploy.
    # "expires" (e non add_header) per non perdere gli header di sicurezza del server.
    location = /index.html {
        expires -1;
    }
    location = /ngsw.json {
        expires -1;
    }
    location = /ngsw-worker.js {
        expires -1;
    }
    location = /safety-worker.js {
        expires -1;
    }
    location = /assets/brand/site.webmanifest {
        default_type application/manifest+json;
        expires -1;
    }

    # Brand identity in /assets/brand/ (vedi front/brands). Compatibilita' con i
    # vecchi percorsi: le mail gia' inviate puntano a /assets/<nome>-logo.png e i
    # browser/PWA installate possono chiedere favicon e manifest nella vecchia posizione.
    location ~ ^/assets/[a-z0-9_-]+-logo\.png$ {
        rewrite ^ /assets/brand/logo.png last;
    }
    location ~ ^/assets/(favicon\.ico|favicon\.svg|favicon-96x96\.png|apple-touch-icon\.png|web-app-manifest-192x192\.png|web-app-manifest-512x512\.png|site\.webmanifest)$ {
        rewrite ^/assets/(.*)$ /assets/brand/$1 last;
    }

   

 
}
