 
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/pintour/browser;
    index index.html;

    # SPA principale
    location / {
        try_files $uri @prerender;
    }

    # API backend
    location /api/ {
        set_real_ip_from 0.0.0.0/0;
        real_ip_header X-Forwarded-For;
        real_ip_recursive on;

        proxy_read_timeout 1d;
        proxy_connect_timeout 1d;
        proxy_send_timeout 1d;
        proxy_pass http://back:1801/;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "keep-alive";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @prerender
	{
		

		set $prerender 0;
		if ($http_user_agent ~* "Mediapartners-Google|MetaInspector/5.5.0|OpenGraphCheck|MetadataScraper|MetaInspector|Whatsapp|baiduspider|facebookexternalhit|twitterbot|pinterest|vkshare|googlebot|YandexBot|AppleBot|bingbot|Bingpreview|facebookplatform|msnbot|slurp|Bucean|WebCrawler|TennSpider|PolyBot|WebFountain|WebRACE|baiduspider|facebookexternalhit|twitterbot|rogerbot|linkedinbot|embedly|quora\ link\ preview|showyoubot|outbrain|pinterest|Slackbot|Slack-ImgProxy|Slackbot-LinkExpanding|Site\ Analyzer|SiteAnalyzerBot|Viber|Whatsapp|Telegram [NC,OR]")
		{
			set $prerender 1;
		}
		if ($args ~ "_escaped_fragment_")
		{
			set $prerender 1;
		}
		if ($http_user_agent ~ "Prerender")
		{
			set $prerender 0;
		}
		 

		#resolve using Google's DNS server to force DNS resolution and prevent caching of IPs
		resolver 8.8.8.8;

		if ($prerender = 1)
		{ 
           proxy_pass https://prerender.carminepola.it/render?url=$scheme://$host$request_uri;

		}
		if ($prerender = 0)
		{
			rewrite .* /index.html break;
		}
	}

   
}
