worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile           on;
    keepalive_timeout  65;

    # --- MAP per user-agent bot ---
    map $http_user_agent $is_bot {
        default 0;
        "~*Prerender" 0;
        "~*googlebot" 1;
        "~*yahoo!\ slurp" 1;
        "~*bingbot" 1;
        "~*yandex" 1;
        "~*baiduspider" 1;
        "~*facebookexternalhit" 1;
        "~*twitterbot" 1;
        "~*linkedinbot" 1;
        "~*slackbot" 1;
        "~*vkshare" 1;
        "~*applebot" 1;
        "~*whatsapp" 1;
        "~*telegrambot" 1;
    }

    # --- MAP per _escaped_fragment_ ---
    map $args $escaped_fragment {
        default $is_bot;
        "~(^|&)_escaped_fragment_=" 1;
    }

    # --- MAP finale per decidere prerender ---
    map $uri $use_prerender {
        default $escaped_fragment;
        "~*\.(js|css|xml|less|png|jpg|jpeg|gif|pdf|txt|ico|rss|zip|mp3|rar|exe|wmv|doc|avi|ppt|mpg|mpeg|tif|wav|mov|psd|ai|xls|mp4|m4a|swf|dat|dmg|iso|flv|m4v|torrent|ttf|woff|woff2|svg|eot)" 0;
    }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        root /usr/share/nginx/pintour/browser;
        index index.html index.htm index.nginx-debian.html;

        # --- location principale ---
        location / {
            # se è bot → prerender locale
            proxy_pass http://prerender:3000;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $host;

            # fallback per utenti normali
            try_files $uri $uri/ /index.html;
        }

        # --- API ---
        location /api/ {
            set_real_ip_from 0.0.0.0/0;
            real_ip_header X-Forwarded-For;
            real_ip_recursive on;

            proxy_read_timeout 1d;
            proxy_connect_timeout 1d;
            proxy_send_timeout 1d; 
            proxy_pass http://back:1801/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "keep-alive";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_headers_hash_max_size 512;
            proxy_headers_hash_bucket_size 128;
        }
    }
}
