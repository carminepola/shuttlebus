<!-- Template: scripts/apply-brand.mjs genera src/index.html con i valori del brand. -->
<!doctype html>
<html lang="it" translate="no">
  <head>
    <meta charset="utf-8" />
    <title>{{documentTitle}}</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="google" content="notranslate" />

    <link
      rel="icon"
      type="image/png"
      href="/assets/brand/favicon-96x96.png"
      sizes="96x96"
    />
    <link rel="icon" type="image/svg+xml" href="/assets/brand/favicon.svg" />
    <link rel="shortcut icon" href="/assets/brand/favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/assets/brand/apple-touch-icon.png"
    />
    <meta name="apple-mobile-web-app-title" content="{{name}}" />
    <meta name="theme-color" content="{{themeColor}}" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/assets/brand/site.webmanifest" />
  </head>

  <body>
    <app-root></app-root>
  </body>
</html>
