<div class="container-fluid container-lg">
  <app-title-page
    title="Prenotazioni"
    subtitle="Gestisci le prenotazioni"
    back="true"
  ></app-title-page>

  <div
    *ngIf="loading"
    class="w-100 d-flex align-items-center justify-content-center"
  >
    <app-loading></app-loading>
  </div>

  <div class="card shadow border-0 rounded-4" *ngIf="!loading">
    <!-- Header Section -->
    <div class="card-header bg-white rounded-top-4 border-bottom py-4">
      <div class="row align-items-center gy-3">
        <div class="col-md">
          <div class="input-group">
            <span class="input-group-text bg-light border-0 icon-container">
              <i class="fas fa-calendar-alt"></i>
            </span>
            <input
              [(ngModel)]="filter.date"
              type="date"
              class="form-control form-control-lg bg-light border-0"
              placeholder="Seleziona data"
            />
          </div>
        </div>

        <div class="col-md">
          <select
            [(ngModel)]="filter.routeId"
            (change)="
              filter.scheduleId = ''; calculateSchedules(filter.routeId)
            "
            class="form-select form-select-lg bg-light border-0"
          >
            <option selected value="">Filtra per tratta</option>
            <option
              [value]="route.id"
              *ngFor="let route of routes"
              [innerHTML]="route.name | translateName"
            ></option>
          </select>
        </div>
        <div class="col-md">
          <select
            [(ngModel)]="filter.scheduleId"
            class="form-select form-select-lg bg-light border-0"
          >
            <option value="">Filtra per schedulazione</option>
            <option
              [value]="s.id"
              *ngFor="let s of filterSchedule"
              [innerHTML]="s.name"
            ></option>
          </select>
        </div>
        <div class="col-md-auto">
          <button
            class="btn btn-primary btn-lg h-100 rounded-3 w-100"
            (click)="filterButton()"
          >
            <i class="fas fa-filter me-2"></i>Applica Filtri
          </button>
        </div>
      </div>
      <div class="row mt-3">
        <div class="col-md">
          <div class="input-group">
            <span class="input-group-text bg-light border-0 icon-container"
              ><i class="fas fa-search"></i
            ></span>
            <input
              type="text"
              class="form-control form-control-lg bg-light border-0"
              placeholder="Cerca biglietto..."
            />
          </div>
        </div>
      </div>
    </div>

    <!-- Mobile View (Cards) -->
    <div class="mobile-cards p-3 d-block d-lg-none">
      <div class="card mb-3 shadow-sm rounded-4">
        <div class="card-body">
          <h5 class="card-title mb-3">Napoli - Roma (9:00)</h5>
          <p class="mb-2">
            Stazione scelta:
            <span class="text-secondary">Via Romani (10:00)</span>
          </p>
          <p class="mb-2">
            Scende a: <span class="text-secondary">Roma (12:00)</span>
          </p>
          <p class="mb-2">
            Nome: <span class="text-secondary">Mario Rossi</span>
          </p>
          <p class="mb-2">
            Email:
            <span
              class="text-secondary"
              [innerHTML]="'mario.rossi@example.com'"
            ></span>
          </p>
          <p class="mb-2">
            Telefono: <span class="text-secondary">+39 333 123 4567</span>
          </p>
          <p class="mb-2">
            Posti: <span class="text-secondary">2 adulti, 1 bambino</span>
          </p>
          <p class="mb-2">Bagagli: <span class="text-secondary">2</span></p>
          <p class="mb-0">
            Totale pagato: <span class="text-secondary">€50</span>
          </p>
        </div>
      </div>
    </div>

    <!-- Desktop View (Table) -->
    <div class="desktop-table p-4 d-none d-lg-block">
      <div class="table-responsive">
        <table class="table table-borderless table-striped align-middle">
          <thead class="bg-light">
            <tr>
              <th>N.Biglietto</th>
              <th scope="col">Tratta</th>
              <th scope="col">Partenza</th>
              <th scope="col">Arrivo</th>
              <th scope="col">Dati utente</th>

              <th scope="col">Posti</th>
              <th scope="col">Bagagli</th>
              <th scope="col">Totale</th>
              <th scope="col" class="rounded-end-3">Azioni</th>
            </tr>
          </thead>
          <tbody>
            <tr class="bg-white" *ngFor="let b of booking">
              <td [innerHTML]="b.ticketId"></td>
              <td [innerHTML]="b.route"></td>
              <td [innerHTML]="b.from"></td>
              <td [innerHTML]="b.to"></td>

              <td>
                <div *ngIf="b.name" [innerHTML]="b.name"></div>
                <a
                  [href]="'tel:' + b.phone"
                  *ngIf="b.phone"
                  [innerHTML]="b.phone"
                ></a>
                <a
                  [href]="'mailto:' + b.mail"
                  *ngIf="b.mail"
                  [innerHTML]="b.mail"
                ></a>
              </td>

              <td>
                <div *ngFor="let t of b.ticket">
                  <div>
                    <span [innerHTML]="t.count"></span>
                    <span class="text-secondary">X</span>
                    <span [innerHTML]="t.name.it"></span>
                  </div>
                </div>
              </td>
              <td class="text-center">
                <span [innerHTML]="b.bagagli"></span>
              </td>
              <td>
                <span [innerHTML]="b.total"></span
                ><span class="text-secondary">€</span>
              </td>
              <td>
                <button disabled class="btn btn-danger btn-sm rounded-3">
                  <i class="fas fa-trash"></i>
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
