<div class="w-100 vh-100 d-flex justify-content-center align-items-center">
  <app-loading *ngIf="loading"></app-loading>
  <div *ngIf="!loading && !notDriver">
    <div *ngIf="book && book.status === 'confirmed'" class="text-center">
      <h2>
        <i class="fa-solid fa-ticket me-2"></i>
        <span [innerHTML]="book.numberOfTickets"></span>
      </h2>
      <h1 class="text-success"><i class="fa-solid fa-check me-2"></i>Valido</h1>
      <h1
        [class]="{
          'text-danger': !todayDate(book.date),
          'text-success': todayDate(book.date)
        }"
      >
        <i class="fa-solid fa-calendar-days me-2"></i>
        <span [innerHTML]="book.date | date : 'dd/MM/yyyy'"></span>
      </h1>
      <h1 class="my-3">
        <i class="fa-solid fa-bus me-2"></i>
        <span>
          {{ book.from.name }}
          <span class="text-secondary">({{ book.from.stopTime }})</span></span
        >
      </h1>
      <h1 class="my-3">
        <i class="fa-solid fa-map-pin me-2"></i>
        <span>
          {{ book.to.name }}
          <span class="text-secondary">({{ book.to.stopTime }})</span></span
        >
      </h1>
      <h1 *ngFor="let t of book.ticketTypes">
        <i class="fa-solid fa-person"></i>
        {{ t.count }} <span class="text-secondary">X</span> {{ t.name.it }}
      </h1>
      <h1 *ngIf="book.luggage > 0">
        <i class="fa-solid fa-suitcase-rolling me-2"></i>
        {{ book.luggage }} <span class="text-secondary">X</span> Bagagli extra
      </h1>
    </div>
    <div *ngIf="!book || book.status !== 'confirmed'">
      <h1 class="text-danger">
        <i class="fa-solid fa-ban me-2"></i>Non valido
      </h1>
    </div>
  </div>
  <div *ngIf="!loading && notDriver" class="text-center">
    <h1 class="text-primary">
      <span [innerHTML]="'str_not_driver'"></span>
    </h1>

    <button
      routerLink="/"
      class="btn btn-secondary btn-lg shadow-sm px-5 mt-3 py-3"
      [innerHTML]="'str_torna_home' | translate"
    ></button>
  </div>
</div>
