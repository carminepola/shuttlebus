<div class="d-flex min-vh-100">
  <div
    class="d-none d-lg-block col-lg-6 bg-dark position-relative overflow-hidden"
  >
    <div
      class="position-absolute top-0 start-0 w-100 h-100 background-gradient"
    ></div>
    <div
      class="position-relative z-index-10 d-flex flex-column justify-content-center align-items-center h-100 text-white text-center p-5"
    >
      <i class="fas fa-user fa-8x mb-4"></i>
      <h2 class="display-4 fw-bold mb-4">Benvenuto</h2>
      <p class="fs-4 text-gray-300">
        Accedi al pannello di controllo di Pintour
      </p>
    </div>
  </div>

  <div
    class="col-12 col-lg-6 d-flex align-items-center justify-content-center p-5"
  >
    <div class="w-100">
      <div class="mb-4 text-center">
        <h2 class="display-5 fw-bold text-primary">Accedi al tuo account</h2>
        <p class="mt-2 text-muted">
          Questa sezione è dedicata all'amministrazione
        </p>
      </div>

      <form [formGroup]="loginForm" (submit)="onSubmit($event)" novalidate>
        <div *ngIf="loginError" class="alert alert-danger mb-4">
          {{ loginError }}
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input
            id="email"
            formControlName="email"
            type="email"
            autocomplete="email"
            class="form-control"
            placeholder="Inserisci la tua email"
            [ngClass]="{
              'is-invalid': isSubmitted && formControls['email'].invalid,
          
            }"
          />
          <div
            *ngIf="isSubmitted && formControls['email'].errors"
            class="invalid-feedback"
          >
            <div *ngIf="formControls['email'].errors['required']">
              Email è richiesta
            </div>
            <div *ngIf="formControls['email'].errors['email']">
              Email non valida
            </div>
          </div>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input
            id="password"
            formControlName="password"
            type="password"
            autocomplete="password"
            class="form-control"
            placeholder="Inserisci la tua password"
            [ngClass]="{
              'is-invalid': isSubmitted && formControls['password'].invalid,
             
            }"
          />
          <div
            *ngIf="isSubmitted && formControls['password'].errors"
            class="invalid-feedback"
          >
            <div *ngIf="formControls['password'].errors['required']">
              Password è richiesta
            </div>
            <div *ngIf="formControls['password'].errors['minlength']">
              Password deve essere lunga almeno 6 caratteri
            </div>
          </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-3">
          <div class="form-check">
            <input
              formControlName="rememberMe"
              id="rememberMe"
              name="rememberMe"
              type="checkbox"
              class="form-check-input"
            />
            <label for="rememberMe" class="form-check-label">Ricordami</label>
          </div>

          <div class="text-end">
            <a href="#" routerLink="/lostpassword" class="text-secondary"
              >Password dimenticata?</a
            >
          </div>
        </div>

        <div
          class="d-flex flex-column justify-content-center align-items-center"
        >
          <button
            type="submit"
            [disabled]="isLoading"
            class="btn btn-secondary w-100 d-flex justify-content-center align-items-center"
          >
            <span *ngIf="!isLoading">Accedi</span>
            <div
              *ngIf="isLoading"
              class="spinner-border spinner-border-sm text-white"
              role="status"
            ></div>
          </button>

          <button class="btn btn-danger w-100 mt-3" (click)="loginWithGoogle()">
            <i class="fa-brands fa-google me-2"></i>Accedi con google
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
