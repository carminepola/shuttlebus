<div class="container-fluid container-lg">
  <app-title-page
    title="Clienti"
    subtitle="Gestisci i clienti"
    back="true"
  ></app-title-page>
  <div class="card shadow border-0 rounded-4">
    <!-- Header Section -->
    <div class="card-header bg-white rounded-top-4 border-bottom py-4">
      <div class="row align-items-center gy-3">
        <div class="col-md">
          <div class="input-group">
            <span class="input-group-text bg-light border-0 icon-container"
              ><i class="fas fa-search"></i
            ></span>
            <input
              type="text"
              class="form-control form-control-lg bg-light border-0"
              placeholder="Filtra per nome..."
            />
          </div>
        </div>
        <div class="col-md">
          <div class="input-group">
            <span class="input-group-text bg-light border-0 icon-container"
              ><i class="fas fa-search"></i
            ></span>
            <input
              type="text"
              class="form-control form-control-lg bg-light border-0"
              placeholder="Filtra per email..."
            />
          </div>
        </div>
        <div class="col-md">
          <div class="input-group">
            <span class="input-group-text bg-light border-0 icon-container"
              ><i class="fas fa-search"></i
            ></span>
            <input
              type="text"
              class="form-control form-control-lg bg-light border-0"
              placeholder="Filtra per numero..."
            />
          </div>
        </div>
      </div>
    </div>

    <!-- Mobile View (Cards) -->
    <div class="mobile-cards p-3 d-block d-lg-none">
      <!-- Card 1 -->
      <div class="card mb-3 shadow-sm rounded-4">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-start mb-3">
            <h5 class="card-title mb-0">Mario Rossi</h5>
            <div>
              <button class="btn btn-info btn-sm me-2 rounded-3">
                <i class="fas fa-info-circle"></i>
              </button>
              <button class="btn btn-danger btn-sm rounded-3">
                <i class="fas fa-trash"></i>
              </button>
            </div>
          </div>
          <p class="mb-2">
            Email:
            <span
              class="text-secondary"
              [innerHTML]="'mario.rossi@example.com'"
            ></span>
          </p>
          <p class="mb-2">
            Numero: <span class="text-secondary">+39 333 123 4567</span>
          </p>
          <p class="mb-0">
            Numero Prenotazioni: <span class="text-secondary">5</span>
          </p>
        </div>
      </div>
      <!-- Additional cards can be added here -->
    </div>

    <!-- Desktop View (Table) -->
    <div class="desktop-table p-4 d-none d-lg-block">
      <div class="table-responsive">
        <table class="table table-borderless align-middle">
          <thead class="bg-light">
            <tr>
              <th scope="col">Nome</th>
              <th scope="col">Email</th>
              <th scope="col">Numero</th>
              <th scope="col">Numero Prenotazioni</th>
              <th scope="col" class="rounded-end-3">Azioni</th>
            </tr>
          </thead>
          <tbody>
            <tr class="bg-white mb-2">
              <td>Mario Rossi</td>
              <td [innerHTML]="'mario.rossi@example.com'"></td>
              <td>+39 333 123 4567</td>
              <td>5</td>
              <td>
                <button class="btn btn-info btn-sm me-2 rounded-3">
                  <i class="fas fa-info-circle"></i>
                </button>
                <button class="btn btn-danger btn-sm rounded-3">
                  <i class="fas fa-trash"></i>
                </button>
              </td>
            </tr>
            <!-- Additional rows can be added here -->
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
