<div class="bg-page align-items-center">
  <!-- Logo (visibile solo su schermi piccoli) -->

  <!-- Sezione principale con sfondo e form -->
  <div
    class="d-block d-lg-flex justify-content-center align-items-center"
    @fadeInOut
  >
    <div class="d-block d-lg-none mb-2 pt-2">
      <div class="card border-0 rounded-4 mx-2 glass">
        <div class="card-body d-flex justify-content-center align-items-center">
          <img
            src="../../../assets/pintour-logo.png"
            alt="pintour-logo"
            style="max-height: 35px"
          />
        </div>
      </div>
    </div>

    <!-- Card per il contenuto del form con sfondo vetro -->
    <div class="card mx-lg-5 mx-2 rounded-4 shadow border-0 card-home glass">
      <div class="card-header rounded-4 border-0">
        <h2
          class="card-title text-primary fw-bold d-none d-lg-block"
          [innerHTML]="'str_main_title' | translate"
        ></h2>
        <h4
          class="card-title text-primary fw-bold d-block d-lg-none"
          [innerHTML]="'str_main_title' | translate"
        ></h4>
      </div>
      <div class="card-body">
        @if (("str_alert" | translate) != "str_alert") {
          <div>
            <div
              class="alert border-0 shadow-sm alert-danger mx-0 mx-lg-4"
              role="alert"
              [innerHTML]="'str_alert' | translate"
            ></div>
          </div>
        }
        <app-search></app-search>
      </div>
    </div>
  </div>
</div>

<div class="container-fluid">
  <div class="row bg-secondary">
    <div
      class="col-12 col-lg-6 top-padding bg-secondary d-flex align-items-center justify-content-center radius-border-card left-column"
    >
      <div class="mx-3 mx-lg-5 d-block">
        <h2
          class="text-white fw-bold"
          [innerHTML]="'str_secondary_title' | translate"
        ></h2>
        <div
          class="text-white"
          [innerHTML]="'str_secondary_text' | translate"
        ></div>
        <div
          class="text-white"
          [innerHTML]="'str_secondary_text2' | translate"
        ></div>
      </div>
    </div>
    <div class="col-12 col-lg-6 bg-amalfi"></div>
  </div>
</div>

<div class="container-fluid">
  <div class="row">
    <div
      class="col-12 col-lg-6 d-flex align-items-center justify-content-center mt-5 my-lg-5 py-lg-5"
    >
      <div>
        <h3
          class="fw-bold text-secondary"
          [innerHTML]="'str_non_sai' | translate"
        ></h3>
        <div
          class="text-muted"
          [innerHTML]="'str_non_sai_text' | translate"
        ></div>
        <div class="text-center float-lg-end">
          <a class="btn btn-primary mt-3 btn-sm" [routerLink]="['/busLine/0']">
            <i class="fa-solid fa-map-location-dot me-2"></i>
            <span [innerHTML]="'str_consulta_tratte' | translate"></span>
          </a>
        </div>
      </div>
    </div>
    <div
      class="col-12 col-lg-6 d-flex align-items-center justify-content-center mb-5 mt-5 my-lg-5 py-lg-5"
    >
      <app-maps-of-points></app-maps-of-points>
    </div>
  </div>
</div>
<div class="container-fluid">
  @if (false) {
    <app-bus-status></app-bus-status>
  }
</div>
<app-footer></app-footer>
<!-- Sezione con sfondo differente per il footer o altre informazioni -->
