<div class="hero">
  <div class="container">
    <div class="d-block d-lg-none mb-2">
      <div class="card border-0 rounded-4 glass">
        <div
          class="card-body d-flex justify-content-center align-items-center py-2"
        >
          <img
            src="../../../assets/pintour-logo.png"
            alt="Pintour"
            style="max-height: 32px"
          />
        </div>
      </div>
    </div>
    <div class="row justify-content-center" @fadeInOut>
      <div class="col-12">
        <div class="hero-card glass rounded-4 shadow">
          <div class="card-body px-3 px-lg-4 py-4">
            <h2
              class="card-title text-primary fw-bold mb-4"
              [innerHTML]="'str_main_title' | translate"
            ></h2>
            @if (("str_alert" | translate) != "str_alert") {
              <div
                class="alert border-0 shadow-sm alert-danger mb-3"
                role="alert"
                [innerHTML]="'str_alert' | translate"
              ></div>
            }
            <app-search></app-search>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<section class="about-section bg-secondary">
  <div class="container">
    <div class="row align-items-stretch g-0">
      <div class="col-12 col-lg-6 about-section-text-col glass">
        <div class="about-section-text-inner py-5 px-4 px-lg-5">
          <div class="about-section-accent"></div>
          <h2
            class="fw-bold mb-3"
            [innerHTML]="'str_secondary_title' | translate"
          ></h2>
          <p
            class="about-section-text"
            [innerHTML]="'str_secondary_text' | translate"
          ></p>
          <p
            class="about-section-text"
            [innerHTML]="'str_secondary_text2' | translate"
          ></p>
          <div class="about-section-cta">
            <a
              class="btn btn-secondary rounded-4"
              [routerLink]="['/busLine/0']"
            >
              <i class="fa-solid fa-route me-2"></i>
              <span [innerHTML]="'str_consulta_tratte' | translate"></span>
            </a>
          </div>
        </div>
      </div>
      <div class="col-12 col-lg-6 about-section-img-col">
        <div class="about-section-img-overlay"></div>
        <img
          src="../../../assets/amalfi.png"
          alt="Costiera Amalfitana"
          class="about-section-img"
        />
      </div>
    </div>
  </div>
</section>

<div class="container-fluid map-section">
  <div class="row g-0">
    <div class="col-12 col-lg-5 map-section-info">
      <div class="map-section-info-inner mx-3 mx-lg-5 py-4 py-lg-5">
        <div class="map-section-badge">
          <i class="fa-solid fa-satellite-dish me-2"></i>
          <span>Live Tracking</span>
        </div>
        <h2
          class="fw-bold text-secondary mt-3 mb-3"
          [innerHTML]="'str_non_sai' | translate"
        ></h2>
        <p
          class="text-muted mb-4"
          [innerHTML]="'str_non_sai_text' | translate"
        ></p>
        <div class="map-section-features">
          <div class="map-section-feature">
            <i class="fa-solid fa-location-dot text-primary"></i>
            <span>{{ "str_fermate_attive_tempo_reale" | translate }}</span>
          </div>
          <div class="map-section-feature">
            <i class="fa-solid fa-bus text-primary"></i>
            <span>{{ "str_live_tracking" | translate }}</span>
          </div>
          <div class="map-section-feature">
            <i class="fa-solid fa-route text-primary"></i>
            <span>{{ "str_consulta_tutte_le_tratte" | translate }}</span>
          </div>
        </div>
        <a
          class="btn btn-primary rounded-4 mt-4 px-4"
          [routerLink]="['/busLine/0']"
        >
          <i class="fa-solid fa-map-location-dot me-2"></i>
          <span [innerHTML]="'str_consulta_tratte' | translate"></span>
        </a>
      </div>
    </div>
    <div class="col-12 col-lg-7 map-section-map">
      <app-maps-of-points
        [height]="500"
        [showLegend]="true"
        [showLiveBadge]="true"
      ></app-maps-of-points>
    </div>
  </div>
</div>
<div class="container-fluid">
  @if (false) {
    <app-bus-status></app-bus-status>
  }
</div>
<app-footer></app-footer>
<!-- Sezione con sfondo differente per il footer o altre informazioni -->
