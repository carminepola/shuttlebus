<div class="payment-result-container marginTopBar">
  @if (actions == 'cancel') {
    <div class="payment-result-card">
      <div class="result-icon result-icon-cancel">
        <i class="fa-solid fa-xmark"></i>
      </div>
      <h2
        class="result-title"
        [innerText]="'str_pagamento_annullato' | translate"
      ></h2>
      <p
        class="result-subtitle"
        [innerText]="'str_pagamento_annullato_desc' | translate"
      ></p>
      <p
        class="result-desc"
        [innerText]="'str_pagamento_annullato_desc2' | translate"
      ></p>
      <a
        routerLink="/"
        class="result-btn"
        [innerText]="'str_torna_home' | translate"
      ></a>
    </div>
  }
  @if (actions == 'success') {
    <div class="payment-result-card">
      <div class="result-icon result-icon-success">
        <i class="fa-solid fa-check"></i>
      </div>
      <h2
        class="result-title"
        [innerText]="'str_pagamento_riuscito' | translate"
      ></h2>
      <p
        class="result-subtitle"
        [innerText]="'str_pagamento_riuscito_desc' | translate"
      ></p>
      <p
        class="result-desc"
        [innerText]="'str_pagamento_riuscito_desc2' | translate"
      ></p>
      <a
        [routerLink]="['/user/mytickets']"
        class="result-btn"
        [innerText]="'str_vai_a_account' | translate"
      ></a>
    </div>
  }
</div>
