<div class="pt-5 d-flex align-items-center justify-content-center marginTopBar">
  <div class="text-center" *ngIf="actions == 'cancel'">
    <h1
      class="display-1 fw-bold text-secondary"
      [innerHTML]="'str_pagamento_annullato' | translate"
    ></h1>
    <p
      class="display-6 fw-semibold text-primary mb-3"
      [innerHTML]="'str_pagamento_annullato_desc' | translate"
    ></p>
    <p
      class="text-muted mb-4"
      [innerHTML]="'str_pagamento_annullato_desc2' | translate"
    ></p>
    <a
      routerLink="/"
      class="btn btn-secondary btn-lg shadow-sm px-5 py-3"
      [innerHTML]="'str_torna_home' | translate"
    ></a>
  </div>
  <div class="text-center" *ngIf="actions == 'success'">
    <h1
      class="display-1 fw-bold text-secondary"
      [innerHTML]="'str_pagamento_riuscito' | translate"
    ></h1>
    <p
      class="display-6 fw-semibold text-primary mb-3"
      [innerHTML]="'str_pagamento_riuscito_desc' | translate"
    ></p>
    <p
      class="text-muted mb-4"
      [innerHTML]="'str_pagamento_riuscito_desc2' | translate"
    ></p>
    <a
      [routerLink]="['/user/mytickets']"
      class="btn btn-secondary btn-lg shadow-sm px-5 py-3"
      [innerHTML]="'str_vai_a_account' | translate"
    >
    </a>
  </div>
</div>
