<div class="container-fluid container-lg">
  <app-title-page
    title="Fermate"
    subtitle="Gestisci le fermate"
    back="true"
  ></app-title-page>

  <div
    *ngIf="loading"
    class="w-100 d-flex align-items-center justify-content-center"
  >
    <app-loading></app-loading>
  </div>

  <div class="card shadow border-0 rounded-4" *ngIf="!loading" @fadeInOut>
    <!-- Header Section -->
    <div class="card-header bg-white rounded-top-4 border-bottom py-4">
      <div class="row align-items-center gy-3">
        <div class="col-md">
          <div class="input-group">
            <span class="input-group-text bg-light border-0 icon-container"
              ><i class="fas fa-search"></i
            ></span>
            <input
              [(ngModel)]="search"
              type="text"
              class="form-control form-control-lg bg-light border-0"
              placeholder="Cerca fermata..."
            />
          </div>
        </div>
        <div class="col-md-auto">
          <a
            class="btn btn-primary btn-lg h-100 rounded-3 w-100"
            [routerLink]="['/admin/fermata']"
          >
            <i class="fas fa-plus me-2"></i>Nuova Fermata
          </a>
        </div>
      </div>

      <!-- Search Bar -->
    </div>

    <!-- Mobile View (Cards) -->
    <div class="mobile-cards p-3 d-block d-lg-none">
      <!-- Card 1 -->
      <div
        class="card mb-3 border-0 shadow-sm rounded-4"
        *ngFor="let stop of stops | filter : search"
      >
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-start mb-2">
            <h5 class="card-title mb-0" [innerHTML]="stop.name"></h5>
            <div>
              <button
                class="btn btn-warning btn-sm me-2 rounded-3"
                (click)="edit(stop.id)"
              >
                <i class="fas fa-edit"></i>
              </button>
              <button
                class="btn btn-danger btn-sm rounded-3"
                (click)="delete(stop.id)"
              >
                <i class="fas fa-trash"></i>
              </button>
            </div>
          </div>

          <p class="mb-2 text-muted" [innerHTML]="stop.description"></p>

          <div class="d-flex align-items-center justify-content-between">
            <div>
              <p class="text-secondary mb-0" [innerHTML]="stop.address"></p>
            </div>
            <div
              class="bg-light rounded-0 py-2 px-3 d-inline-flex align-items-center mb-2"
            >
              <i class="fas fa-location-dot me-2"></i>
              <small
                ><span [innerText]="stop.latitude"></span>,
                <span [innerText]="stop.longitude"></span
              ></small>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Desktop View (Table) -->
    <div class="desktop-table p-4 d-none d-lg-block">
      <div class="table-responsive">
        <table class="table table-borderless table-striped align-middle">
          <thead class="bg-light">
            <tr>
              <th scope="col">Nome</th>
              <th scope="col">Descrizione</th>
              <th scope="col">Posizione</th>
              <th scope="col">Indirizzo</th>

              <th scope="col" class="rounded-end-3">Azioni</th>
            </tr>
          </thead>
          <tbody>
            <tr
              class="bg-white mb-2"
              *ngFor="let stop of stops | filter : search"
            >
              <td [innerText]="stop.name"></td>
              <td [innerText]="stop.description"></td>
              <td>
                <span
                  class="bg-light py-2 px-3 d-inline-flex align-items-center"
                >
                  <i class="fas fa-location-dot me-2"></i>
                  <small
                    ><span [innerText]="stop.latitude"></span>,
                    <span [innerText]="stop.longitude"></span
                  ></small>
                </span>
              </td>
              <td [innerHTML]="stop.address"></td>

              <td style="min-width: 80px">
                <button
                  class="btn btn-warning btn-sm me-2 rounded-3"
                  (click)="edit(stop.id)"
                >
                  <i class="fas fa-edit"></i>
                </button>
                <button
                  class="btn btn-danger btn-sm rounded-3"
                  (click)="delete(stop.id)"
                >
                  <i class="fas fa-trash"></i>
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
