<div class="container-fluid container-lg">
  <app-title-page
    [title]="'Tipo biglietto'"
    subtitle=" Gestisci la tipologia di biglietto"
    back="true"
  ></app-title-page>

  @if (loading) {
    <div
      class="w-100 d-flex align-items-center justify-content-center"
      >
      <app-loading></app-loading>
    </div>
  }
  @if (!loading) {
    <div class="card border-0 rounded-4 shadow" @fadeInOut>
      <div class="card-body">
        <form ngNativeValidate (ngSubmit)="onSubmit(f)" #f="ngForm">
          <div class="row g-3">
            <div class="col-12 col-md-6">
              <label for="name_it" class="form-label">Nome biglietto IT</label>
              <input
                [(ngModel)]="form.name.it"
                name="name_it"
                type="text"
                placeholder="Nome biglietto"
                class="form-control"
                id="name_it"
                required
                />
            </div>
            <div class="col-12 col-md-6">
              <label for="name_en" class="form-label">Nome biglietto EN</label>
              <input
                [(ngModel)]="form.name.en"
                name="name_en"
                type="text"
                placeholder="Ticket name"
                class="form-control"
                id="name_en"
                required
                />
            </div>
            <div class="col-12 col-md-6">
              <label for="name_fr" class="form-label">Nome biglietto FR</label>
              <input
                [(ngModel)]="form.name.fr"
                name="name_fr"
                type="text"
                placeholder="Nom du billet"
                class="form-control"
                id="name_fr"
                />
            </div>
            <div class="col-12 col-md-6">
              <label for="name_de" class="form-label">Nome biglietto DE</label>
              <input
                [(ngModel)]="form.name.de"
                name="name_de"
                type="text"
                placeholder="Ticketname"
                class="form-control"
                id="name_de"
                />
            </div>
            <div class="col-12 col-md-6">
              <label for="name_es" class="form-label">Nome biglietto ES</label>
              <input
                [(ngModel)]="form.name.es"
                name="name_es"
                type="text"
                placeholder="Nombre del billete"
                class="form-control"
                id="name_es"
                />
            </div>
            <div class="col-12 col-md-6">
              <label for="name_jp" class="form-label">Nome biglietto JP</label>
              <input
                [(ngModel)]="form.name.jp"
                name="name_jp"
                type="text"
                placeholder="チケット名"
                class="form-control"
                id="name_jp"
                />
            </div>
            <div class="col-12 col-md-6">
              <label for="desc_it" class="form-label">Descrizione IT</label>
              <textarea
                [(ngModel)]="form.description.it"
                name="desc_it"
                class="form-control"
                id="desc_it"
                required
              ></textarea>
            </div>
            <div class="col-12 col-md-6">
              <label for="desc_en" class="form-label">Descrizione EN</label>
              <textarea
                [(ngModel)]="form.description.en"
                name="desc_en"
                class="form-control"
                id="desc_en"
                required
              ></textarea>
            </div>
            <div class="col-12 col-md-6">
              <label for="desc_fr" class="form-label">Descrizione FR</label>
              <textarea
                [(ngModel)]="form.description.fr"
                name="desc_fr"
                class="form-control"
                id="desc_fr"
              ></textarea>
            </div>
            <div class="col-12 col-md-6">
              <label for="desc_de" class="form-label">Descrizione DE</label>
              <textarea
                [(ngModel)]="form.description.de"
                name="desc_de"
                class="form-control"
                id="desc_de"
              ></textarea>
            </div>
            <div class="col-12 col-md-6">
              <label for="desc_es" class="form-label">Descrizione ES</label>
              <textarea
                [(ngModel)]="form.description.es"
                name="desc_es"
                class="form-control"
                id="desc_es"
              ></textarea>
            </div>
            <div class="col-12 col-md-6">
              <label for="desc_jp" class="form-label">Descrizione JP</label>
              <textarea
                [(ngModel)]="form.description.jp"
                name="desc_jp"
                class="form-control"
                id="desc_jp"
              ></textarea>
            </div>
            <div class="col-12 col-md-6">
              <label for="cost" class="form-label">Costo in €</label>
              <input
                [(ngModel)]="form.cost"
                name="cost"
                type="number"
                class="form-control"
                id="cost"
                required
                />
            </div>
            <div class="col-12">
              <div class="form-check form-switch">
                <input
                  [(ngModel)]="form.isActive"
                  name="isActive"
                  class="form-check-input"
                  type="checkbox"
                  role="switch"
                  id="flexSwitchCheckDefault"
                  />
                <label class="form-check-label" for="flexSwitchCheckDefault"
                  >Attiva</label
                  >
                </div>
              </div>
              @if (errorMessage != '') {
                <div class="col-12">
                  <div class="alert alert-danger border-0">{{ errorMessage }}</div>
                </div>
              }
            </div>
            <div class="mt-3">
              <button type="submit" class="float-end btn btn-secondary">
                Salva
              </button>
            </div>
          </form>
        </div>
      </div>
    }
  </div>
