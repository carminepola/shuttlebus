<div class="container-fluid container-lg marginTopBar">
  <app-title-page
    [title]="'str_personal_area' | translate"
    back="true"
  ></app-title-page>

  <div>
    <ol class="list-group border-0 rounded-4 shadow" @fadeInOut>
      <li
        (click)="goTo('/user/mytickets')"
        class="list-group-item list-group-item-action cursor-pointer d-flex p-3 justify-content-between align-items-center"
      >
        <i class="fa fa-ticket me-3 fs-3"></i>
        <div class="ms-2 me-auto">
          <div class="fw-bold" [innerText]="'str_my_tickets' | translate"></div>
          <span [innerText]="'str_my_tickets_desc' | translate"></span>
        </div>
      </li>

      <li
        class="list-group-item list-group-item-action cursor-pointer d-flex p-3 justify-content-between align-items-center"
      >
        <i class="fa-solid fa-user me-3 fs-3"></i>
        <div class="ms-2 me-auto">
          <div class="fw-bold" [innerText]="'str_profile' | translate"></div>
          <span [innerHTML]="'str_profile_desc' | translate"></span>
        </div>
      </li>
      <li
        (click)="logout()"
        class="list-group-item bg-danger text-white list-group-item-action cursor-pointer d-flex p-3 justify-content-between align-items-center"
      >
        <i class="fas fa-sign-out-alt me-3 fs-3"></i>
        <div class="ms-2 me-auto">
          <div class="fw-bold" [innerText]="'str_logout' | translate"></div>
          <div>
            <span [innerText]="'str_logout_desc' | translate"></span>
          </div>
        </div>
      </li>
    </ol>
  </div>
</div>
