<div class="container" @fadeInOut [ngClass]="{ marginTopBar: navBar }">
  <app-title-page
    [title]="'str_setting' | translate"
    [subtitle]="'str_setting_desc' | translate"
    back="true"
  ></app-title-page>
  <div class="card border-0 rounded-4 shadow">
    <div class="card-body">
      <div class="row">
        <div>
          <h3 class="text-muted">{{ "str_cambia_password" | translate }}</h3>
        </div>
        <div class="col mb-2">
          <form [formGroup]="changePasswordForm" (ngSubmit)="onSubmit()">
            <div class="mb-3">
              <label for="oldPassword" class="form-label">{{
                "str_old_password" | translate
              }}</label>
              <input
                id="oldPassword"
                type="password"
                formControlName="oldPassword"
                class="form-control"
                required
                [placeholder]="'insert_old_password' | translate"
              />
              <div
                *ngIf="
                  changePasswordForm.get('oldPassword')?.touched &&
                  changePasswordForm.get('oldPassword')?.invalid
                "
                class="invalid-feedback"
              >
                <div
                  *ngIf="
                    changePasswordForm.get('oldPassword')?.hasError('required')
                  "
                >
                  {{ "str_campo_obbligatorio" | translate }}
                </div>
              </div>
            </div>
            <div class="mb-3">
              <label
                for="newPassword"
                class="form-label"
                [innerHTML]="'str_new_password' | translate"
              ></label>
              <input
                id="newPassword"
                type="password"
                formControlName="newPassword"
                class="form-control"
                required
                [placeholder]="'insert_new_password' | translate"
              />
              <div
                *ngIf="
                  changePasswordForm.get('newPassword')?.touched &&
                  changePasswordForm.get('newPassword')?.invalid
                "
                class="invalid-feedback"
              >
                <div
                  *ngIf="
                    changePasswordForm.get('newPassword')?.hasError('required')
                  "
                >
                  {{ "str_campo_obbligatorio" | translate }}
                </div>
                <div
                  *ngIf="
                    changePasswordForm.get('newPassword')?.hasError('minlength')
                  "
                >
                  {{ "str_lng_password" | translate }}
                </div>
              </div>
            </div>
            <div class="mb-3">
              <label for="repeatPassword" class="form-label">{{
                "str_ripeti_password" | translate
              }}</label>
              <input
                id="repeatPassword"
                type="password"
                formControlName="repeatPassword"
                class="form-control"
                required
                [placeholder]="'str_ripeti_password' | translate"
              />
              <div
                *ngIf="
                  changePasswordForm.get('repeatPassword')?.touched &&
                  changePasswordForm.get('repeatPassword')?.invalid
                "
                class="invalid-feedback"
              >
                <div
                  *ngIf="
                    changePasswordForm
                      .get('repeatPassword')
                      ?.hasError('required')
                  "
                >
                  {{ "str_campo_obbligatorio" | translate }}
                </div>
                <div
                  *ngIf="
                    changePasswordForm
                      .get('repeatPassword')
                      ?.hasError('mustMatch')
                  "
                >
                  {{ "str_password_must_match" | translate }}
                </div>
              </div>
            </div>
            <button type="submit" class="btn btn-secondary float-end">
              <i class="fas fa-save me-2"></i>
              Salva
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
