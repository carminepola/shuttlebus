<div class="container-fluid container-lg">
  <app-title-page
    title="Utenti"
    subtitle="Gestisci gli utenti"
    back="true"
  ></app-title-page>
  <div class="card shadow border-0 rounded-4">
    <!-- Header Section -->
    <div class="card-header bg-white rounded-top-4 border-bottom py-4">
      <div class="row align-items-center gy-3">
        <div class="col-md">
          <div class="input-group">
            <span class="input-group-text bg-light border-0 icon-container"
              ><i class="fas fa-search"></i
            ></span>
            <input
              type="text"
              class="form-control form-control-lg bg-light border-0"
              placeholder="Cerca utente..."
            />
          </div>
        </div>
        <div class="col-md-auto">
          <a
            class="btn btn-primary btn-lg h-100 rounded-3 w-100"
            [routerLink]="['/admin/utente']"
          >
            <i class="fas fa-plus me-2"></i>Nuovo utente
          </a>
        </div>
      </div>

      <!-- Search Bar -->
    </div>

    <!-- Mobile View (Cards) -->
    <div class="mobile-cards p-3 d-block d-lg-none">
      <!-- Card 1 -->
      <div class="card mb-3 border-0 shadow-sm rounded-4">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-start mb-3">
            <h5 class="card-title mb-0">Utente admin</h5>
            <div>
              <button class="btn btn-warning btn-sm me-2 rounded-3">
                <i class="fas fa-edit"></i>
              </button>
              <button class="btn btn-danger btn-sm rounded-3">
                <i class="fas fa-trash"></i>
              </button>
            </div>
          </div>

          <p class="text-secondary mb-2">Ruolo: Amministratore</p>
          <p class="text-secondary mb-0">Nome utente: admin</p>
        </div>
      </div>

      <!-- Card 2 -->
      <div class="card mb-3 border-0 shadow-sm rounded-4">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-start mb-3">
            <h5 class="card-title mb-0">Utente user</h5>
            <div>
              <button class="btn btn-warning btn-sm me-2 rounded-3">
                <i class="fas fa-edit"></i>
              </button>
              <button class="btn btn-danger btn-sm rounded-3">
                <i class="fas fa-trash"></i>
              </button>
            </div>
          </div>

          <p class="text-secondary mb-2">Ruolo: Utente</p>
          <p class="text-secondary mb-0">Nome utente: user</p>
        </div>
      </div>
    </div>

    <!-- Desktop View (Table) -->
    <div class="desktop-table p-4 d-none d-lg-block">
      <div class="table-responsive">
        <table class="table table-borderless align-middle">
          <thead class="bg-light">
            <tr>
              <th scope="col">Nome utente</th>
              <th scope="col">Ruolo</th>
              <th scope="col">Azioni</th>
            </tr>
          </thead>
          <tbody>
            <tr class="bg-white mb-2">
              <td>admin</td>
              <td>Amministratore</td>
              <td>
                <button class="btn btn-warning btn-sm me-2 rounded-3">
                  <i class="fas fa-edit"></i>
                </button>
                <button class="btn btn-danger btn-sm rounded-3">
                  <i class="fas fa-trash"></i>
                </button>
              </td>
            </tr>
            <tr class="bg-white">
              <td>user</td>
              <td>Utente</td>
              <td>
                <button class="btn btn-warning btn-sm me-2 rounded-3">
                  <i class="fas fa-edit"></i>
                </button>
                <button class="btn btn-danger btn-sm rounded-3">
                  <i class="fas fa-trash"></i>
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
