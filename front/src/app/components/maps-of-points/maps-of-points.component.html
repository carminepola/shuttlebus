<div class="map-wrapper">
  @if (loading) {
    <div class="map-loading-overlay">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>
  }

  <div #mapContainer class="map" [style.height.px]="height"></div>

  @if (showLiveBadge && !loading) {
    <div class="map-live-badge">
      <span class="live-dot"></span>
      <span>Live</span>
    </div>
  }

  @if (showLegend && !loading) {
    <div class="map-legend">
      <div class="legend-item">
        <img
          src="https://maps.google.com/mapfiles/kml/paddle/pink-blank.png"
          alt="Fermata"
          class="legend-icon"
        />
        <span>{{ "str_fermate" | translate }} ({{ stopCount }})</span>
      </div>
      <div class="legend-item">
        <span class="legend-icon legend-icon-bus" aria-hidden="true"></span>
        <span>{{ "str_autobus" | translate }} ({{ busCount }})</span>
      </div>
    </div>
  }

  @if (lastUpdated && !loading) {
    <div class="map-last-updated">
      <small>{{ lastUpdated | date: "HH:mm" }}</small>
    </div>
  }
</div>
