<div style="width: 100%; height: 600px">
  <google-map #map [center]="center" [zoom]="zoom" height="100%" width="100%">
    <map-marker
      *ngFor="let marker of markers"
      [position]="marker.position"
      [icon]="marker.icon"
      (mapClick)="(marker)"
    ></map-marker>
  </google-map>
</div>
