          <a

            [class.active]="getPath() == '/'"

<div class="modal fade show" tabindex="-1" id="modalLogin">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="d-flex justify-content-between align-items-center py-2 px-3">
        <nav class="nav nav-pills nav-fill">
          <a
            (click)="login = true"
            class="nav-link cursor-pointer"
            [ngClass]="{ active: login }"
            aria-current="page"
            >LOGIN</a
          >
          <a
            (click)="login = false"
            class="nav-link cursor-pointer"
            [ngClass]="{ active: !login }"
            aria-current="page"
            >REGISTRATI</a
          >
        </nav>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Close"
        ></button>
      </div>
      <div class="modal-body">
        <app-login-form
          *ngIf="login"
          (loginSuccess)="onEvent()"
        ></app-login-form>
        <app-registrazione
          (registerSuccess)="onComplete()"
          *ngIf="!login"
        ></app-registrazione>
      </div>
    </div>
  </div>
</div>
