@if (show) {
  <div class="cookie">
    <div class="rounded-4 glass">
      <div [innerHTML]="'str_cookie_policy' | translate"></div>
      <div class="d-flex mt-3">
        <div
          class="btn btn-primary w-50 me-1"
          (click)="acceptCookies()"
          [innerText]="'str_accept' | translate"
        ></div>
        <div
          class="btn btn-outline-primary ms-1 w-50"
          (click)="rejectCookies()"
          [innerText]="'str_reject' | translate"
        ></div>
      </div>
    </div>
  </div>
}
