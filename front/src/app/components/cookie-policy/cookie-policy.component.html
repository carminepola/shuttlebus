@if (show) {
  <div class="cp-overlay">
    <div class="cp-card glass">
      <div class="cp-card-icon">
        <i class="fa-solid fa-cookie-bite"></i>
      </div>
      <h3 class="cp-card-title">Cookie Policy</h3>
      <p class="cp-card-text" [innerHTML]="'str_cookie_policy' | translate"></p>
      <div class="cp-actions">
        <button
          class="cp-btn cp-btn-accept"
          (click)="acceptCookies()"
          [innerText]="'str_accept' | translate"
        ></button>
        <button
          class="cp-btn cp-btn-reject"
          (click)="rejectCookies()"
          [innerText]="'str_reject' | translate"
        ></button>
      </div>
    </div>
  </div>
}
