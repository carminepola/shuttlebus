@if (show) {
  <div
    class="cp-banner glass"
    role="dialog"
    aria-live="polite"
    aria-label="Cookie Policy"
  >
    <div class="cp-inner">
      <div class="cp-header">
        <span class="cp-icon">
          <i class="fa-solid fa-cookie-bite"></i>
        </span>
        <h3 class="cp-title">Cookie Policy</h3>
      </div>
      <p class="cp-text" [innerHTML]="'str_cookie_policy' | translate"></p>
      <a
        class="cp-link"
        role="link"
        tabindex="0"
        (click)="goToPolicy()"
        (keydown.enter)="goToPolicy()"
        >Privacy Policy</a
      >
      <div class="cp-actions">
        <button
          class="cp-btn cp-btn-accept"
          (click)="acceptCookies()"
          [innerText]="'str_accept' | translate"
        ></button>
        <button
          class="cp-btn cp-btn-reject"
          (click)="rejectCookies()"
          [innerText]="'str_reject' | translate"
        ></button>
      </div>
    </div>
    <span class="cp-countdown" aria-hidden="true"></span>
  </div>
}
