<!-- Mobile Header -->
<div
  class="overlay position-fixed top-0 start-0 w-100 h-100 bg-dark bg-opacity-50 d-lg-none"
  *ngIf="isMenuOpen"
  (click)="toggleMenu()"
></div>
<div style="width: 250px" class="d-lg-block d-none"></div>
<div class="fixed-top bg-primary d-lg-none shadow p-3">
  <div class="d-flex align-items-center justify-content-between">
    <div class="d-flex align-items-center">
      <div class="dropdown">
        <button
          class="btn btn-link text-white"
          id="dropdownMenuButton"
          data-bs-toggle="dropdown"
          aria-expanded="false"
          role="button"
        >
          <i class="fa-solid fa-ellipsis-vertical"></i>
        </button>
        <ul class="dropdown-menu px-1" aria-labelledby="dropdownMenuButton">
          <li class="mb-2">
            <a
              class="dropdown-item rounded"
              [routerLink]="['/admin/usersettings']"
              routerLinkActive="btn-secondary-active"
            >
              <i class="fas fa-user-gear me-3 text-secondary"></i>
              <span>Impostazioni utente</span>
            </a>
          </li>

          <li>
            <button
              [disabled]="isLoadingLogout"
              role="button"
              class="dropdown-item bg-secondary rounded text-white"
              (click)="onLogout()"
            >
              <i class="fas fa-sign-out-alt me-3"></i> Esci
            </button>
          </li>
        </ul>
      </div>
      <img
        *ngIf="image"
        [src]="image"
        class="rounded-circle me-3"
        style="width: 48px; height: 48px"
      />
      <div
        *ngIf="!image"
        class="rounded-circle bg-secondary d-flex align-items-center justify-content-center me-3"
        style="width: 40px; height: 40px"
      >
        <i class="fas fa-user text-white"></i>
      </div>
      <div class="text-truncate" style="max-width: calc(100% - 2.5rem)">
        <h2 class="h5 fw-bold text-white mb-0 text-truncate">
          {{ username }}
        </h2>
        <p class="small text-light mb-0 text-truncate">Benvenuto</p>
      </div>
      <div class="dropdown ms-3" *ngIf="notification.length > 0">
        <button
          class="btn btn-link text-white"
          id="dropdownNotification"
          data-bs-toggle="dropdown"
          aria-expanded="false"
          role="button"
        >
          <span
            style="top: 80%; left: 80%; z-index: 20"
            *ngIf="notification.length > 0"
            class="position-absolute translate-middle badge rounded-pill bg-danger"
          >
            {{ notification.length }}
            <span class="visually-hidden">unread messages</span>
          </span>

          <i class="fa-solid fa-bell"></i>
        </button>
        <div
          class="dropdown-menu px-1"
          *ngIf="notification.length > 0"
          style="max-height: 60vh; overflow-y: scroll; min-width: 80vw"
          aria-labelledby="dropdownNotification"
          style="min-width: 80vw"
        >
          <div class="list-group list-group-flush scrollarea">
            <a
              *ngFor="let nt of notification"
              class="cursor-pointer list-group-item list-group-item-action py-3 lh-tight border-bottom"
              aria-current="true"
            >
              <div class="fw-bold">{{ nt.title }}</div>
              <div class="fs-6">
                {{ nt.message }}
              </div>
              <div class="small text-muted float-end">{{ nt.date }}</div>
            </a>
          </div>
        </div>
      </div>
    </div>

    <button class="btn btn-link text-white p-2" (click)="toggleMenu()">
      <i class="fas" [ngClass]="isMenuOpen ? 'fa-times' : 'fa-bars'"></i>
    </button>
  </div>
</div>

<!-- Sidebar -->
<aside
  class="fixed-top h-100 bg-primary sidebar"
  [ngClass]="{ show: isMenuOpen }"
>
  <!-- Desktop Header -->
  <div class="d-none d-lg-flex align-items-center justify-content-between p-4">
    <div class="d-flex align-items-center">
      <img
        *ngIf="image"
        [src]="image"
        class="rounded-circle me-3"
        style="width: 48px; height: 48px"
      />
      <div
        *ngIf="!image"
        class="rounded-circle bg-secondary d-flex align-items-center justify-content-center me-3"
        style="width: 48px; height: 48px"
      >
        <i class="fas fa-user text-white"></i>
      </div>
      <div class="text-truncate">
        <h2 class="h4 fw-bold text-white mb-0 text-truncate">{{ username }}</h2>
        <p class="small text-light mb-0">Benvenuto</p>
      </div>
    </div>
  </div>
  <div class="container-fluid d-none d-lg-block">
    <div class="row">
      <div class="col-4">
        <button
          class="btn w-100 text-white"
          routerLinkActive="btn-secondary-active"
          routerLink="/admin/usersettings"
        >
          <i class="fas fa-user-gear"></i>
          <span class="visually-hidden">Impostazioni</span>
        </button>
      </div>
      <div class="col-4 text-center">
        <div class="dropdown">
          <button
            class="btn btn-link text-white"
            [disabled]="notification.length > 0"
            id="dropdownNotification"
            data-bs-toggle="dropdown"
            aria-expanded="false"
            role="button"
          >
            <span
              style="top: 80%; left: 80%; z-index: 20"
              *ngIf="notification.length > 0"
              class="position-absolute translate-middle badge rounded-pill bg-danger"
            >
              {{ notification.length }}
              <span class="visually-hidden">unread messages</span>
            </span>

            <i class="fa-solid fa-bell"></i>
          </button>
          <div
            class="dropdown-menu px-1"
            *ngIf="notification.length > 0"
            style="max-height: 60vh; overflow-y: scroll; min-width: 80vw"
            aria-labelledby="dropdownNotification"
          >
            <div class="list-group list-group-flush scrollarea">
              <a
                href="#"
                *ngFor="let nt of notification"
                class="list-group-item list-group-item-action py-3 lh-tight border-bottom"
                aria-current="true"
              >
                <div class="fw-bold">{{ nt.title }}</div>
                <div class="fs-6">
                  {{ nt.message }}
                </div>
                <div class="small text-muted float-end">{{ nt.date }}</div>
              </a>
            </div>
          </div>
        </div>
      </div>
      <div class="col-4">
        <button
          [disabled]="isLoadingLogout"
          (click)="onLogout()"
          class="btn btn-link text-white w-100"
        >
          <i class="fas fa-sign-out-alt" *ngIf="!isLoadingLogout"></i>
          <span
            class="spinner-border spinner-border-sm"
            role="status"
            aria-hidden="true"
            *ngIf="isLoadingLogout"
          ></span>
          <span class="visually-hidden">Esci</span>
        </button>
      </div>
    </div>
  </div>
  <!-- Navigation -->
  <nav>
    <ul class="nav nav-pills flex-column mb-auto mx-2">
      <li class="nav-item my-2" *ngFor="let item of menuItems">
        <a
          [routerLink]="item.route"
          routerLinkActive="active"
          class="nav-link py-2-5"
          (click)="onMenuItemClick()"
        >
          <i
            class="fas text-secondary me-3"
            style="min-width: 25px"
            [ngClass]="item.icon"
          ></i>
          <span class="text-white" [innerHTML]="item.title"></span>
        </a>
      </li>
    </ul>
  </nav>
</aside>

<!-- Overlay -->
