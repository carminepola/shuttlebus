services:
  back:
    image: pintour2/back:dev
    restart: unless-stopped
    hostname: back
    env_file:
      - ./back/.env
  front:
    hostname: front
    image: pintour2/front:dev
    restart: unless-stopped
    ports:
      - "4200:80"
  mongodb:
    hostname: db
    image: mongo:latest
    container_name: mongodb-repl
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_DATA_DIR: /data/db
    command: >
      mongod --replSet rs0 --bind_ip_all --auth
      --keyFile /opt/keyfile/mongodb-keyfile
    ports:
      - "27018:27017"
    volumes:
      - data:/data/db
      - ./db/keyFile:/opt/keyfile:ro
  prerender:
    hostname: prerender
    image: ramnkl/prerender-host:v2
    container_name: prerender
    restart: unless-stopped
    ports:
      - "3000:3000"

networks:
  default:
volumes:
  data:
