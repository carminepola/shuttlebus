<div class="fixed top-0 left-0 right-0 bg-dark-blue z-50 px-6 py-4 lg:hidden shadow-lg">
    <div class="flex items-center justify-between">
        <div class="flex items-center">
            <div class="w-10 h-10 bg-pink rounded-full flex items-center justify-center mr-3">
                <i class="fas fa-user text-white"></i>
            </div>
            <div class="truncate max-w-[calc(100%-2.5rem)]">
                <h2 class="text-lg font-bold text-white truncate">{{ username }}</h2>
                <p class="text-sm text-gray-300 truncate">Benvenuto</p>
            </div>
        </div>
        <button
            class="w-10 h-10 flex items-center justify-center text-white hover:bg-pink/20 rounded-lg transition-colors"
            (click)="toggleMenu()">
            <i class="fas {{ isMenuOpen ? 'fa-times' : 'fa-bars' }} text-xl"></i>
        </button>
    </div>
</div>

<!-- Sidebar -->
<aside
    class="fixed top-0 left-0 h-full w-64 bg-dark-blue transform transition-transform duration-300 ease-in-out lg:translate-x-0 z-40"
    [class.translate-x-0]="isMenuOpen" [class.translate-x-[-100%]]="!isMenuOpen">
    <!-- Desktop Header -->
    <div class="hidden lg:flex items-center justify-between p-6 pb-0">
        <div class="flex items-center">
            <div class="w-12 h-12 bg-pink rounded-full flex items-center justify-center mr-4">
                <i class="fas fa-user text-white"></i>
            </div>
            <div class="truncate ">
                <h2 class="text-xl font-bold text-white truncate max-w-[160px]">{{username}}</h2>
                <p class="text-sm text-gray-300 truncate">Benvenuto</p>
            </div>
        </div>

    </div>

    <!-- Navigation -->
    <nav class="px-4   pt-20 lg:pt-0">
        <div class="flex items-center justify-between  p-6">
            <button (click)="onLogout()" class="text-white hover:text-pink transition-colors relative group">
                <i class="fas fa-cog text-xl"></i>
                <span
                    class="absolute top-full mt-1 hidden group-hover:block bg-gray-700 text-white t  rounded py-1 px-2">
                    Impostazioni
                </span>
            </button>
            <button (click)="onLogout()" class="text-white hover:text-pink transition-colors relative group">
                <i class="fas fa-bell text-xl"></i>
                <span class="absolute top-full mb-1 hidden group-hover:block bg-gray-700 text-white  rounded py-1 px-2">
                    Notifiche
                </span>
            </button>
            <button [disabled]="isLoadingLogout" (click)="onLogout()"
                class="text-white hover:text-pink transition-colors relative group">
                <i class="fas fa-sign-out-alt text-xl" *ngIf="!isLoadingLogout"></i>
                <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2"
                    *ngIf="isLoadingLogout">
                    <div class="animate-spin rounded-full h-5 w-5 border-b-2 border-white"></div>
                </div>
                <span class="absolute top-full mb-1 hidden group-hover:block bg-gray-700 text-white  rounded py-1 px-2">
                    Esci
                </span>
            </button>
        </div>
        <ul class="space-y-2">
            <li *ngFor="let item of menuItems">
                <a [routerLink]="item.route" routerLinkActive="bg-pink/20"
                    class="flex items-center px-4 py-3 text-gray-300 hover:text-white rounded-lg hover:bg-pink/20 transition-colors"
                    (click)="onMenuItemClick()">
                    <i class="fas {{ item.icon }} text-pink w-6"></i>
                    <span class="ml-3">{{ item.title }}</span>
                </a>
            </li>




        </ul>
    </nav>
</aside>

<!-- Overlay -->
<div *ngIf="isMenuOpen" class="fixed inset-0 bg-black bg-opacity-50 z-30 lg:hidden" (click)="toggleMenu()"></div>
