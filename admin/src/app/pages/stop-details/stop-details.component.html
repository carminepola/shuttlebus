<div class="container">
    <app-title-page [title]="'Fermata'" subtitle=" Gestisci la fermata" back="true"></app-title-page>
    <div class="card border-0 rounded-4 shadow">
        <div class="card-body " [formGroup]="stopForm">

            <form (ngSubmit)="onSubmit()">
                <div class="row g-3">
                    <div class="col-12 col-md-6">
                        <label for="name_it" class="form-label">Nome Italiano</label>
                        <input type="text" placeholder="Es. Piazza Garibaldi" formControlName="name_it"
                            class="form-control" id="name_it" formControlName="name_it" required>
                    </div>
                    <div class="col-12 col-md-6">
                        <label for="name_en" class="form-label">Nome Inglese</label>
                        <input type="text" placeholder="Es. Garibaldi Place" formControlName="name_en"
                            class="form-control" id="name_en" formControlName="name_en" required>
                    </div>
                    <div class="col-12 col-md-6">
                        <label for="desc_it" class="form-label">Descrizione Italiana</label>
                        <textarea formControlName="desc_it" class="form-control" id="desc_it" formControlName="desc_it"
                            required></textarea>
                    </div>
                    <div class="col-12 col-md-6">
                        <label for="desc_en" class="form-label">Descrizione Inglese</label>
                        <textarea formControlName="desc_en" class="form-control" id="desc_en" formControlName="desc_en"
                            required></textarea>
                    </div>
                    <div class="col-12 col-md-6">
                        <label for="lat" class="form-label">Latitudine</label>
                        <input formControlName="lat" placeholder="32.34556" type="number" class="form-control" id="lat"
                            formControlName="lat" required>
                    </div>
                    <div class="col-12 col-md-6">
                        <label for="lon" class="form-label">Longitudine</label>
                        <input formControlName="lon" placeholder="12.34556" type="number" class="form-control" id="lon"
                            formControlName="lon" required>
                    </div>
                    <div class="col-12 col-md-6">
                        <label for="img" class="form-label">Foto</label>
                        <input formControlName="img" type="file" class="form-control" id="img"
                            (change)="onImageChange($event)">
                    </div>

                </div>
                <div class="mt-3">
                    <button type="submit" class="float-end btn btn-secondary">Salva</button>
                </div>
            </form>

        </div>
    </div>
</div>
