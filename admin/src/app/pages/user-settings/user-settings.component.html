<div @fadeInOut>
    <!-- Back Button -->
    <div class="container mx-auto px-4 mb-6">
        <button (click)="goBack()" class="flex items-center text-gray-600 hover:text-pink transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd"
                    d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z"
                    clip-rule="evenodd" />
            </svg>
            Torna indietro
        </button>
    </div>

    <div class="container mx-auto px-4">
        <div class="bg-white shadow-lg rounded-lg overflow-hidden border border-gray-100">
            <div class="bg-gradient-to-r px-6 py-4 border-b border-gray-200">
                <h2 class="text-xl font-semibold text-dark-blue">
                    {{ isEdit ? "Modifica" : "Nuova" }} Fermata
                </h2>
            </div>
            <div class="p-6 bg-white/80">
                <!-- Loading State -->
                <div *ngIf="loading" class="flex justify-center py-4">
                    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-pink"></div>
                </div>

                <!-- Error State -->
                <div *ngIf="error" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-6"
                    role="alert">
                    {{ error }}
                </div>

                <!-- Form -->
                <form [formGroup]="fermataForm" (ngSubmit)="onSubmit()" *ngIf="!loading" class="space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <!-- Nome Fermata -->
                        <div class="space-y-2">
                            <label for="nome" class="block text-sm font-medium text-gray-700">Nome Fermata *</label>
                            <input type="text" id="nome" formControlName="nome"
                                class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-pink focus:ring focus:ring-pink focus:ring-opacity-50"
                                [ngClass]="{ 'border-red-500': isFieldInvalid('nome') }" />
                            <div *ngIf="isFieldInvalid('nome')" class="text-red-500 text-sm">
                                {{ getErrorMessage("nome") }}
                            </div>
                        </div>

                        <!-- Indirizzo -->
                        <div class="space-y-2">
                            <label for="indirizzo" class="block text-sm font-medium text-gray-700">Indirizzo *</label>
                            <input type="text" id="indirizzo" formControlName="indirizzo"
                                class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-pink focus:ring focus:ring-pink focus:ring-opacity-50"
                                [ngClass]="{ 'border-red-500': isFieldInvalid('indirizzo') }" />
                            <div *ngIf="isFieldInvalid('indirizzo')" class="text-red-500 text-sm">
                                {{ getErrorMessage("indirizzo") }}
                            </div>
                        </div>

                        <!-- Città -->
                        <div class="space-y-2">
                            <label for="citta" class="block text-sm font-medium text-gray-700">Città *</label>
                            <input type="text" id="citta" formControlName="citta"
                                class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-pink focus:ring focus:ring-pink focus:ring-opacity-50"
                                [ngClass]="{ 'border-red-500': isFieldInvalid('citta') }" />
                            <div *ngIf="isFieldInvalid('citta')" class="text-red-500 text-sm">
                                {{ getErrorMessage("citta") }}
                            </div>
                        </div>

                        <!-- Provincia -->
                        <div class="space-y-2">
                            <label for="provincia" class="block text-sm font-medium text-gray-700">Provincia *</label>
                            <select id="provincia" formControlName="provincia"
                                class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-pink focus:ring focus:ring-pink focus:ring-opacity-50"
                                [ngClass]="{ 'border-red-500': isFieldInvalid('provincia') }">
                                <option value="">Seleziona provincia</option>
                                <option *ngFor="let prov of province" [value]="prov.code">
                                    {{ prov.name }} ({{ prov.code }})
                                </option>
                            </select>
                            <div *ngIf="isFieldInvalid('provincia')" class="text-red-500 text-sm">
                                {{ getErrorMessage("provincia") }}
                            </div>
                        </div>

                        <!-- Coordinate -->
                        <div class="space-y-2">
                            <label for="latitudine" class="block text-sm font-medium text-gray-700">Latitudine</label>
                            <input type="number" id="latitudine" formControlName="latitudine"
                                class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-pink focus:ring focus:ring-pink focus:ring-opacity-50"
                                [ngClass]="{ 'border-red-500': isFieldInvalid('latitudine') }" />
                            <div *ngIf="isFieldInvalid('latitudine')" class="text-red-500 text-sm">
                                {{ getErrorMessage("latitudine") }}
                            </div>
                        </div>

                        <div class="space-y-2">
                            <label for="longitudine" class="block text-sm font-medium text-gray-700">Longitudine</label>
                            <input type="number" id="longitudine" formControlName="longitudine"
                                class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-pink focus:ring focus:ring-pink focus:ring-opacity-50"
                                [ngClass]="{ 'border-red-500': isFieldInvalid('longitudine') }" />
                            <div *ngIf="isFieldInvalid('longitudine')" class="text-red-500 text-sm">
                                {{ getErrorMessage("longitudine") }}
                            </div>
                        </div>

                        <!-- Stato -->
                        <div class="space-y-2">
                            <div class="flex items-center space-x-3">
                                <input type="checkbox" id="attiva" formControlName="attiva"
                                    class="h-4 w-4 rounded border-gray-300 text-pink focus:ring-pink" />
                                <label for="attiva" class="text-sm font-medium text-gray-700">Fermata attiva</label>
                            </div>
                        </div>

                        <!-- Note -->
                        <div class="space-y-2 md:col-span-2">
                            <label for="note" class="block text-sm font-medium text-gray-700">Note</label>
                            <textarea id="note" rows="3" formControlName="note"
                                class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-pink focus:ring focus:ring-pink focus:ring-opacity-50"></textarea>
                        </div>
                    </div>

                    <!-- Form Actions -->
                    <div class="flex justify-end space-x-4 mt-6 pt-4 border-t border-gray-200">
                        <button type="button" (click)="goBack()" class=" px-4 py-2 border border-gray-300 rounded-md text-sm font-medium text-gray-700
                            hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-pink">
                            Annulla
                        </button>
                        <button type="submit" [disabled]="loading || fermataForm.invalid"
                            class="px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-pink hover:bg-pink-dark focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-pink disabled:opacity-50 disabled:cursor-not-allowed">
                            {{ isEdit ? "Salva modifiche" : "Crea fermata" }}
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
