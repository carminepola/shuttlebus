<div class="d-flex min-vh-100">
  <!-- Colonna sinistra, visibile solo su schermi grandi -->
  <div
    class="d-none d-lg-block col-lg-6 bg-dark position-relative overflow-hidden"
  >
    <div class="position-absolute top-0 start-0 w-100 h-100"></div>
    <div
      class="position-relative z-index-10 d-flex flex-column justify-content-center align-items-center h-100 text-white text-center p-5 background-gradient"
    >
      <i class="fas fa-user fa-8x mb-4"></i>
      <h2 class="display-4 fw-bold mb-4">Lost Password</h2>
      <p class="fs-4 text-gray-300">
        Inserisci il tuo indirizzo email per ricevere una nuova password
      </p>
    </div>
  </div>

  <!-- Colonna destra -->
  <div
    class="col-12 col-lg-6 d-flex align-items-center justify-content-center p-5"
  >
    <div class="w-100 max-w-md">
      <div class="mb-4">
        <a
          href="#"
          routerLink="/login"
          class="d-flex align-items-center text-secondary"
        >
          <i class="fas fa-arrow-left me-2"></i>
          Torna alla login
        </a>
      </div>

      <h1 class="text-3xl font-bold text-primary mb-3">Recupero Password</h1>

      <!-- Form di recupero password -->

      <div *ngIf="success">
        <div class="alert alert-success mb-4">
          Ti è stata inviata una nuova password controlla la mail in entrata e
          non dimenticarti di guardare negli spam
        </div>
        <button class="btn btn-outline-secondary w-100" routerLink="/login">
          Torna alla login
        </button>
      </div>

      <form
        [formGroup]="lostPasswordForm"
        (submit)="onSubmit($event)"
        novalidate
        *ngIf="!codeSent && !success"
      >
        <div *ngIf="loginError" class="alert alert-danger mb-4">
          {{ loginError }}
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input
            id="email"
            formControlName="email"
            type="email"
            required
            autocomplete="email"
            class="form-control"
            [ngClass]="{
              'is-invalid':
                lostPasswordForm.get('email')?.touched &&
                lostPasswordForm.get('email')?.invalid
            }"
            placeholder="Inserisci la tua email"
          />

          <div
            *ngIf="
              lostPasswordForm.get('email')?.touched &&
              lostPasswordForm.get('email')?.invalid
            "
            class="invalid-feedback"
          >
            <div *ngIf="lostPasswordForm.get('email')?.hasError('required')">
              Campo obbligatorio
            </div>
            <div *ngIf="lostPasswordForm.get('email')?.hasError('email')">
              Inserisci un indirizzo email valido
            </div>
          </div>
        </div>
        <!--      <div class="mb-3 float-end">
          <a (click)="codeSent = true" class="text-secondary">
            Ho già un codice</a
          >
        </div>
 -->
        <button
          type="submit"
          [disabled]="isLoading"
          class="btn btn-secondary w-100 d-flex justify-content-center align-items-center"
        >
          <span *ngIf="!isLoading">Recupera password</span>
          <div
            *ngIf="isLoading"
            class="spinner-border spinner-border-sm text-white"
            role="status"
          ></div>
        </button>
      </form>
