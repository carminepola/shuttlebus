<div class="flex min-h-screen">

    <div class="hidden lg:block lg:w-1/2 bg-dark-blue relative overflow-hidden">
        <div class="absolute inset-0 bg-gradient-to-bl from-pink via-dark-blue-palette-600 to-dark-blue opacity-90">
        </div>
        <div class="relative z-10 flex flex-col justify-center items-center h-full text-white text-center p-12">
            <i class="fas fa-user fa-8x text-white mb-8"></i>
            <h2 class="text-4xl font-bold mb-4">Lost Password</h2>
            <p class="text-xl text-gray-300">Inserisci il tuo indirizzo email per ricevere un codice di verifica</p>
        </div>
    </div>
    <div class="w-full lg:w-1/2 flex items-center justify-center px-6 py-12 lg:px-8">
        <div class="w-full max-w-md">
            <div class="container mx-auto  mb-6">
                <a htref="#" routerLink="/login"
                    class="flex items-center text-gray-600 hover:text-pink transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" viewBox="0 0 20 20"
                        fill="currentColor">
                        <path fill-rule="evenodd"
                            d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z"
                            clip-rule="evenodd" />
                    </svg>
                    Torna alla login
                </a>
            </div>

            <h1 class="text-3xl font-bold tracking-tight text-dark-blue mb-6">Recupero Password</h1>
            <form [formGroup]="lostPasswordForm" (submit)="onSubmit($event)" novalidate class="space-y-6"
                *ngIf="!codeSent">
                <div>

                    <label for="email" class="block text-sm font-medium text-dark-blue">Email *</label>
                    <div class="mt-1">
                        <input id="email" [ngClass]="{
            
                'border-pink':lostPasswordForm.get('email')?.touched && lostPasswordForm.get('email')?.invalid 
              }" formControlName="email" type="email" required autocomplete="email"
                            class="block w-full appearance-none rounded-md border px-3 py-2 placeholder-dark-blue/50 text-dark-blue shadow-sm focus:border-pink focus:outline-none focus:ring-2 focus:ring-pink sm:text-sm"
                            placeholder="Inserisci la tua email" />
                        <div *ngIf="lostPasswordForm.get('email')?.value && lostPasswordForm.get('email')?.invalid && lostPasswordForm.get('email')?.touched"
                            class="text-red-500 text-sm mt-1">
                            Inserisci un indirizzo email valido
                        </div>
                        <div *ngIf=" !lostPasswordForm.get('email')?.value && lostPasswordForm.get('email')?.invalid && lostPasswordForm.get('email')?.touched"
                            class="text-red-500 text-sm mt-1">
                            Campo obbligatorio
                        </div>
                    </div>
                </div>
                <div class="mt-4">
                    <button type="submit" [disabled]="isLoading"
                        class="flex w-full cursor-pointer disabled:cursor-not-allowed disabled:bg-pink-palette-400  justify-center rounded-md bg-pink px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-pink/90 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-pink">
                        <span *ngIf="!isLoading">Invia Codice</span>
                        <div *ngIf="isLoading" class="flex items-center justify-center">
                            <div class="animate-spin rounded-full h-5 w-5 border-b-2 border-white"></div>
                        </div>
                    </button>

                </div>
            </form>
            <div *ngIf="codeSent" class="mt-8">
                
                <form   (submit)="onSubmitCode($event)" novalidate>
                    <p class="text-sm text-gray-600 mb-4">Inserisci il codice di verifica a 6 cifre ricevuto via email
                    </p>
                    <div class="flex space-x-2 justify-center mb-4">
                        <input type="text" maxlength="1"
                            class="w-12 h-12 text-center border rounded-md text-dark-blue focus:border-pink focus:outline-none focus:ring-2 focus:ring-pink"
                            (input)="onInput($event, 0)" (keydown)="onKeydown($event, 0)" (paste)="onPaste($event)" />

                        <div (paste)="onPaste($event)"></div>
                        <input type="text" maxlength="1"
                            class="w-12 h-12 text-center border rounded-md text-dark-blue focus:border-pink focus:outline-none focus:ring-2 focus:ring-pink"
                            (input)="onInput($event, 1)" (keydown)="onKeydown($event, 1)" />
                        <input type="text" maxlength="1"
                            class="w-12 h-12 text-center border rounded-md text-dark-blue focus:border-pink focus:outline-none focus:ring-2 focus:ring-pink"
                            (input)="onInput($event, 2)" (keydown)="onKeydown($event, 2)" />
                        <input type="text" maxlength="1"
                            class="w-12 h-12 text-center border rounded-md text-dark-blue focus:border-pink focus:outline-none focus:ring-2 focus:ring-pink"
                            (input)="onInput($event, 3)" (keydown)="onKeydown($event, 3)" />
                        <input type="text" maxlength="1"
                            class="w-12 h-12 text-center border rounded-md text-dark-blue focus:border-pink focus:outline-none focus:ring-2 focus:ring-pink"
                            (input)="onInput($event, 4)" (keydown)="onKeydown($event, 4)" />
                        <input type="text" maxlength="1"
                            class="w-12 h-12 text-center border rounded-md text-dark-blue focus:border-pink focus:outline-none focus:ring-2 focus:ring-pink"
                            (input)="onInput($event, 5)" (keydown)="onKeydown($event, 5)" />

                    </div>
                    <button type="submit" [disabled]="code.length !== 6 || isLoading"
                        class="flex w-full cursor-pointer disabled:cursor-not-allowed disabled:bg-pink-palette-400 justify-center rounded-md bg-pink px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-pink/90 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-pink">
                        <span *ngIf="!isLoading">Invia Codice</span>
                        <div *ngIf="isLoading" class="flex items-center justify-center">
                            <div class="animate-spin rounded-full h-5 w-5 border-b-2 border-white"></div>
                        </div>
                    </button>
                </form>
            </div>
        </div>
    </div>
