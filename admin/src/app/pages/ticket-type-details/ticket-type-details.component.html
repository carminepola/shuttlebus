<div class="container-fluid container-lg">
  <app-title-page
    [title]="'Tipo biglietto'"
    subtitle=" Gestisci la tipologia di biglietto"
    back="true"
  ></app-title-page>

  <div
    *ngIf="loading"
    class="w-100 d-flex align-items-center justify-content-center"
  >
    <app-loading></app-loading>
  </div>
  <div *ngIf="!loading" class="card border-0 rounded-4 shadow">
    <div class="card-body">
      <form ngNativeValidate (ngSubmit)="onSubmit(f)" #f="ngForm">
        <div class="row g-3">
          <div class="col-12 col-md-6">
            <label for="name_it" class="form-label">Nome fermata it</label>
            <input
              [(ngModel)]="form.name.it"
              name="name_it"
              type="text"
              placeholder="Nome fermata"
              class="form-control"
              id="name_it"
              required
            />
          </div>

          <div class="col-12 col-md-6">
            <label for="name_en" class="form-label">Nome fermata en</label>
            <input
              [(ngModel)]="form.name.en"
              name="name_en"
              type="text"
              placeholder="Name station"
              class="form-control"
              id="name_en"
              required
            />
          </div>

          <div class="col-12 col-md-6">
            <label for="desc_it" class="form-label">Descrizione Italiana</label>
            <textarea
              [(ngModel)]="form.description.it"
              name="desc_it"
              class="form-control"
              id="desc_it"
              required
            ></textarea>
          </div>

          <div class="col-12 col-md-6">
            <label for="desc_en" class="form-label">Descrizione Inglese</label>
            <textarea
              [(ngModel)]="form.description.en"
              name="desc_en"
              class="form-control"
              id="desc_en"
              required
            ></textarea>
          </div>
          <div class="col-12 col-md-6">
            <label for="cost" class="form-label">Costo in €</label>
            <input
              [(ngModel)]="form.cost"
              name="cost"
              type="number"
              class="form-control"
              id="cost"
              required
            />
          </div>

          <div class="col-12">
            <div class="form-check form-switch">
              <input
                [(ngModel)]="form.isActive"
                name="isActive"
                class="form-check-input"
                type="checkbox"
                role="switch"
                id="flexSwitchCheckDefault"
              />
              <label class="form-check-label" for="flexSwitchCheckDefault"
                >Attiva</label
              >
            </div>
          </div>
          <div class="col-12" *ngIf="errorMessage != ''">
            <div class="alert alert-danger border-0">{{ errorMessage }}</div>
          </div>
        </div>
        <div class="mt-3">
          <button type="submit" class="float-end btn btn-secondary">
            Salva
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
