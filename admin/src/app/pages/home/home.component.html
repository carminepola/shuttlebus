<!-- Header -->
<div @fadeInOut>
    <div class="mb-8">
        <h1 class="text-3xl font-bold text-gray-800">Dashboard</h1>
        <p class="mt-2 text-gray-600">
            Benvenuto nel sistema di gestione trasporti
        </p>
    </div>

    <!-- Quick Stats -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
        <div class="bg-white rounded-xl shadow-md p-6">
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-gray-500 text-sm">Corse Oggi</p>
                    <h4 class="text-2xl font-bold text-gray-800 mt-1">24</h4>
                </div>
                <div class="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center">
                    <i class="fas fa-route text-blue-500 text-lg"></i>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-md p-6">
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-gray-500 text-sm">Prenotazioni</p>
                    <h4 class="text-2xl font-bold text-gray-800 mt-1">156</h4>
                </div>
                <div class="w-10 h-10 rounded-full bg-pink-palette-100 flex items-center justify-center">
                    <i class="far fa-calendar-check text-pink-palette-500 text-lg"></i>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-md p-6">
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-gray-500 text-sm">Biglietti Venduti</p>
                    <h4 class="text-2xl font-bold text-gray-800 mt-1">892</h4>
                </div>
                <div class="w-10 h-10 rounded-full bg-violet-100 flex items-center justify-center">
                    <i class="fas fa-ticket-alt text-violet-500 text-lg"></i>
                </div>
            </div>
        </div>
    </div>

    <!-- Dashboard Cards Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mt-8">
        <div *ngFor="let card of dashboardCards" [routerLink]="'/' + card.title.toLowerCase()"
            class="relative overflow-hidden rounded-xl shadow-lg group hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1 cursor-pointer">
            <div class="absolute inset-0 {{ card.color }} opacity-90"></div>
            <div class="relative p-6">
                <div class="flex items-center justify-between mb-4">
                    <div class="w-12 h-12 rounded-lg bg-white/20 flex items-center justify-center">
                        <i class="fas {{ card.icon }} text-2xl text-white"></i>
                    </div>
                    <span class="text-white/70 text-sm">Gestione</span>
                </div>
                <h3 class="text-xl font-bold text-white mb-2">{{ card.title }}</h3>
                <p class="text-white/80 text-sm">{{ card.description }}</p>
                <div class="mt-4 flex justify-end">
                    <span class="text-white/90 hover:text-white flex items-center text-sm font-medium">
                        Vai alla sezione
                        <i class="fas fa-arrow-right ml-2"></i>
                    </span>
                </div>
            </div>
        </div>
    </div>

    <!-- Sales Chart -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-8 lg:col-span-12">
        <div class="bg-white rounded-xl shadow-md p-6">
            <h3 class="text-lg font-semibold text-gray-800 mb-4">
                Andamento Vendite
            </h3>
            <canvas #salesChart class="w-full"></canvas>
        </div>
    </div>
</div>
