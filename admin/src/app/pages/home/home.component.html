<!-- Header -->
<div class="container " @fadeInOut>
    <div class="mb-4">
        <h1 class="h3 text-secondary">Dashboard</h1>
        <p class="mt-2 text-muted">
            Benvenuto nel sistema di gestione trasporti
        </p>
    </div>

    <!-- Quick Stats -->
    <div class="row   mb-4">
        <div class="col-12 col-md-4 mb-2 mb-lg-0">
            <div class="card h-100 border-0 rounded-4 shadow-sm">
                <div class="card-body p-4  ">
                    <div class="row align-items-center">
                        <div class="col">
                            <span class="text-muted small text-uppercase fw-semibold mb-2 d-block">Corse oggi</span>
                            <h3 class="display-6 fw-bold mb-0 text-primary">12</h3>
                        </div>
                        <div class="col-auto">
                            <div class="bg-primary bg-opacity-10 rounded-3 p-3">
                                <i class="fas fa-route fs-3 text-primary"></i>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-12 col-md-4 mb-2 mb-lg-0">
            <div class="card h-100 border-0 rounded-4 shadow-sm">
                <div class="card-body p-4  ">
                    <div class="row align-items-center">
                        <div class="col">
                            <span class="text-muted small text-uppercase fw-semibold mb-2 d-block">Prenotazioni
                                oggi</span>
                            <h3 class="display-6 fw-bold mb-0  text-primary">323</h3>
                        </div>
                        <div class="col-auto">
                            <div class="bg-secondary bg-opacity-10 rounded-3 p-3">
                                <i class="fas fa-envelope fs-3 text-secondary"></i>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <div class="col-12 col-md-4 mb-2 mb-lg-0">
            <div class="card h-100 border-0 rounded-4 shadow-sm">
                <div class="card-body p-4  ">
                    <div class="row align-items-center">
                        <div class="col">
                            <span class="text-muted text-info small text-uppercase fw-semibold mb-2 d-block">Bilietti
                                Venduti oggi
                            </span>
                            <h3 class="display-6 fw-bold mb-0  text-primary">298</h3>
                        </div>
                        <div class="col-auto">
                            <div class="bg-info bg-opacity-10 rounded-3 p-3">
                                <i class="fas fa-ticket fs-3 text-info"></i>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Dashboard Cards Grid -->
    <div class="row g-4">
        <div class="col-12 col-md-6 col-lg-3" *ngFor="let card of dashboardCards">
            <div class="card border-0  rounded-4  h-100   position-relative cursor-pointer cardButton "
                [routerLink]="'/' + card.title.toLowerCase()">
                <div class="position-absolute top-0 start-0 end-0 bottom-0 opacity-90"></div>
                <div class="card-body  position-relative p-4">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div class="rounded-circle d-flex align-items-center justify-content-center"
                            style="width: 48px; height: 48px; background-color: #e67fa691">
                            <i class="fas {{card.icon}} text-secondary fs-4"></i>
                        </div>

                    </div>
                    <h3 class="h5 fw-bold mb-2 text-secondary">{{card.title}}</h3>
                    <p class=" small mb-0">{{card.description}}</p>
                    <div class="mt-4 text-end text-primary">
                        <span class="d-inline-flex align-items-center small fw-medium  ">
                            Vai alla sezione
                            <i class="fas fa-arrow-right ms-2"></i>
                        </span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Sales Chart -->
    <div class="row g-4 mt-4">
        <div class="col-12 col-lg-6">
            <div class="card  border-0 shadow-sm rounded-4  ">
                <div class="card-body">

                    <canvas #salesChart class="w-100"></canvas>
                </div>
            </div>
        </div>
    </div>
</div>
