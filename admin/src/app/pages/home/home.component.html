<!-- Header -->
<div class="container-fluid p-4" @fadeInOut>
  <div class="mb-4">
    <h1 class="h3">Dashboard</h1>
    <p class="mt-2 text-muted">Benvenuto nel sistema di gestione trasporti</p>
  </div>

  <!-- Quick Stats -->
  <div class="row mb-4">
    <div class="col-12 col-md-4 mb-2 mb-lg-0">
      <div class="card h-100 border-0 rounded-4 shadow-sm">
        <div class="card-body p-4">
          <div class="row align-items-center">
            <div class="col">
              <span class="text-muted small mb-2 d-block">Corse oggi</span>
              <span class="fs-3 fw-bold mb-0 text-primary">12</span>
            </div>
            <div class="col-auto">
              <div
                class="bg-success bg-opacity-10 rounded-circle p-3 d-flex justify-content-center align-items-center"
              >
                <i class="fas fa-route fs-5 text-success"></i>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="col-12 col-md-4 mb-2 mb-lg-0">
      <div class="card h-100 border-0 rounded-4 shadow-sm">
        <div class="card-body p-4">
          <div class="row align-items-center">
            <div class="col">
              <span class="text-muted small mb-2 d-block"
                >Prenotazioni oggi</span
              >
              <h3 class="fs-3 fw-bold mb-0 text-primary">323</h3>
            </div>
            <div class="col-auto">
              <div
                class="bg-secondary bg-opacity-10 rounded-circle p-3 d-flex justify-content-center align-items-center"
              >
                <i class="fas fa-envelope fs-5 text-secondary"></i>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="col-12 col-md-4 mb-2 mb-lg-0">
      <div class="card h-100 border-0 rounded-4 shadow-sm">
        <div class="card-body p-4">
          <div class="row align-items-center">
            <div class="col">
              <span class="text-muted small mb-2 d-block"
                >Bilietti venduti oggi
              </span>
              <h3 class="fs-3 fw-bold mb-0 text-primary">298</h3>
            </div>
            <div class="col-auto">
              <div
                class="bg-info bg-opacity-10 rounded-circle p-3 d-flex justify-content-center align-items-center"
              >
                <i class="fas fa-ticket fs-5 text-info"></i>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Dashboard Cards Grid -->
  <div class="row g-4">
    <div class="col-12 col-md-6 col-lg-3" *ngFor="let card of dashboardCards">
      <div
        class="card border-0 rounded-4 h-100 text-white position-relative cursor-pointer cardButton"
        [ngClass]="card.color"
        [routerLink]="'/' + card.title.toLowerCase()"
      >
        <div
          class="position-absolute top-0 start-0 end-0 bottom-0 opacity-90"
        ></div>
        <div class="card-body position-relative p-4">
          <div class="d-flex justify-content-between align-items-center mb-4">
            <div
              class="rounded-circle d-flex align-items-center justify-content-center bg-white bg-opacity-10"
              style="width: 48px; height: 48px"
            >
              <i class="fas {{ card.icon }}   fs-4"></i>
            </div>
            <div class="text-white-50">Gestione</div>
          </div>
          <h3 class="h5 fw-bold mb-2">{{ card.title }}</h3>
          <p class="small mb-0 text-white-50">{{ card.description }}</p>
          <div class="mt-4 text-end">
            <span class="d-inline-flex align-items-center small fw-medium">
              Vai alla sezione
              <i class="fas fa-arrow-right ms-2"></i>
            </span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Sales Chart -->
  <div class="row g-4 mt-4">
    <div class="col-12 col-lg-6">
      <div class="card border-0 shadow-sm rounded-4">
        <div class="card-body">
          <canvas #salesChart class="w-100"></canvas>
        </div>
      </div>
    </div>
  </div>
</div>
